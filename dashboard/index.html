<title>Life Dashboard</title>
<style>
/* Layout: Apple-style widget grid. A quiet date header, four count tiles, one wide briefing tile, then four content tiles in a 2×2 grid. Lots of air, few lines. */
:root {
  color-scheme: dark;
  --bg: #000000;
  --tile: #1C1C1E;
  --fill: rgba(118, 118, 128, .24);
  --seg-on: #636366;
  --hover: rgba(255, 255, 255, .045);
  --sep: #38383A;
  --ink: #F5F5F7;
  --muted: #AEAEB2;
  --faint: #8E8E93;
  --blue: #0A84FF;
  --orange: #FF9F0A;
  --green: #30D158;
  --purple: #BF5AF2;
  --red: #FF453A;
  --yellow: #FFD60A;
  --blue-soft: rgba(10, 132, 255, .16);
  --red-soft: rgba(255, 69, 58, .16);
  --green-soft: rgba(48, 209, 88, .14);
  --yellow-soft: rgba(255, 214, 10, .14);
  --on-color: #FFFFFF;
  --shadow: none;
  --toast: rgba(44, 44, 46, .92);
  --toast-ink: #F5F5F7;
  --toast-accent: #0A84FF;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
}
:root[data-mode="light"] {
  color-scheme: light;
  --bg: #F5F5F7; --tile: #FFFFFF; --fill: rgba(118, 118, 128, .12); --seg-on: #FFFFFF; --hover: rgba(0, 0, 0, .035); --sep: #E5E5EA;
  --ink: #1D1D1F; --muted: #6E6E73; --faint: #7C7C82;
  --blue: #0066CC; --orange: #C93400; --green: #248A3D; --purple: #8944AB; --red: #D70015; --yellow: #A05A00;
  --blue-soft: rgba(0, 102, 204, .10); --red-soft: rgba(215, 0, 21, .08); --green-soft: rgba(36, 138, 61, .10); --yellow-soft: rgba(160, 90, 0, .10);
  --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 8px 28px rgba(0, 0, 0, .05);
  --toast: rgba(29, 29, 31, .92); --toast-ink: #F5F5F7; --toast-accent: #64A8FF;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.47 var(--font); letter-spacing: -0.01em; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--faint); }
button { font: inherit; color: inherit; letter-spacing: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 8px; }

.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 20px; padding-block: 32px 96px; display: grid; gap: 24px; }
@media (min-width: 760px) { .wrap { padding-inline: 40px; padding-block: 56px 120px; gap: 28px; } }

/* Header */
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; }
.day { display: grid; gap: 2px; min-width: 0; }
.day .wd { font-size: 15px; font-weight: 600; color: var(--red); }
.day .wd::first-letter { text-transform: uppercase; }
.day h1 { margin: 0; font-size: clamp(34px, 5vw, 44px); line-height: 1.05; font-weight: 700; letter-spacing: -0.03em; }
.controls { display: flex; align-items: center; gap: 10px; }
.seg { display: inline-flex; padding: 2px; border-radius: 9px; background: var(--fill); }
.seg button { display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent; padding: 5px 14px; border-radius: 7px; font-size: 13px; font-weight: 500; color: var(--ink); cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--seg-on); font-weight: 600; box-shadow: 0 1px 3px rgba(0, 0, 0, .14); }
.seg svg { width: 15px; height: 15px; }
.round { display: grid; place-items: center; width: 34px; height: 34px; border: 0; border-radius: 50%; background: var(--fill); color: var(--ink); cursor: pointer; }
.round svg { width: 16px; height: 16px; }

/* Count tiles */
.counts { display: grid; gap: 16px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 760px) { .counts { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; } }
a.count { display: grid; gap: 12px; padding: 18px 20px 20px; border-radius: 22px; background: var(--tile); box-shadow: var(--shadow); text-decoration: none; }
a.count:hover { text-decoration: none; }
.ic { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--c); color: var(--on-color); flex: none; }
.ic svg { width: 16px; height: 16px; }
.count b { font-size: 34px; line-height: 1; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.count .lbl { font-size: 15px; font-weight: 600; color: var(--muted); }
.count.hot b { color: var(--red); }

/* Tiles */
.tile { background: var(--tile); border-radius: 24px; box-shadow: var(--shadow); padding: 22px 8px 14px; min-width: 0; }
.tile-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; padding: 0 16px 14px; }
.tile-head h2 { display: flex; align-items: center; gap: 10px; margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; color: var(--c); }
.tile-head .end { margin-left: auto; display: flex; align-items: center; gap: 6px; }
#agenda { --c: var(--blue); } #mail { --c: var(--orange); } #tasks { --c: var(--green); } #slack { --c: var(--purple); }
.board { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 980px) { .board { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; } .scroll { max-height: 660px; overflow: auto; overscroll-behavior: contain; } }
.tile-foot { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 16px 0; font-size: 13px; color: var(--faint); font-variant-numeric: tabular-nums; }
.daylbl { font-size: 15px; font-weight: 600; min-width: 8ch; text-align: center; }

.btn { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 6px 14px; border: 0; border-radius: 999px; background: var(--fill); color: var(--blue); font-size: 13px; font-weight: 600; cursor: pointer; }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--blue); color: var(--on-color); }
.ib { display: inline-grid; place-items: center; width: 32px; height: 32px; border: 0; border-radius: 50%; background: transparent; color: var(--muted); cursor: pointer; flex: none; }
.ib:hover { background: var(--fill); color: var(--ink); text-decoration: none; }
.ib:disabled { opacity: .3; cursor: default; background: transparent; }
.ib svg { width: 17px; height: 17px; }

/* Rows */
.list { list-style: none; margin: 0; padding: 0 8px; display: grid; gap: 2px; min-width: 0; }
.row { display: grid; gap: 3px 14px; padding: 12px 10px; border-radius: 14px; min-width: 0; }
.row:hover, .row:focus-within { background: var(--hover); }
.title { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.meta { font-size: 13px; color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.snip { font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.date { font-size: 13px; color: var(--faint); white-space: nowrap; font-variant-numeric: tabular-nums; }
.crit { color: var(--red); } .ok { color: var(--green); }
.acts { display: flex; align-items: center; opacity: 0; transition: opacity .15s ease; }
.row:hover .acts, .row:focus-within .acts, .sgroup:hover .acts, .sgroup:focus-within .acts { opacity: 1; }
@media (hover: none) { .acts { opacity: 1; } }
.empty { margin: 0; padding: 10px 18px 14px; color: var(--muted); }
.note { margin: 0 16px 12px; padding: 12px 14px; border-radius: 14px; background: var(--yellow-soft); color: var(--ink); font-size: 13px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.note.crit { background: var(--red-soft); }
.skel { display: grid; gap: 16px; padding: 10px 18px 18px; }
.skel i { display: block; height: 12px; border-radius: 6px; background: var(--fill); }
.skel i:nth-child(3n+1) { width: 80%; } .skel i:nth-child(3n+2) { width: 60%; } .skel i:nth-child(3n) { width: 42%; }
@media (prefers-reduced-motion: no-preference) { .skel i { animation: pulse 1.4s ease-in-out infinite; } }
@keyframes pulse { 50% { opacity: .45; } }
@media (prefers-reduced-motion: reduce) { .acts, .ghead svg { transition: none; } }

/* Agenda */
.ev { grid-template-columns: 52px minmax(0, 1fr); }
.ev .when { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.35; }
.ev .when span { display: block; font-size: 13px; font-weight: 400; color: var(--faint); }
.ev.past { opacity: .45; }
.ev.declined .title { text-decoration: line-through; color: var(--muted); }
.ev .links { margin-top: 4px; font-size: 13px; }
.ev .links a { color: var(--blue); font-weight: 600; }
.rsvp { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.rsvp.quiet { display: none; }
.row:hover .rsvp.quiet, .row:focus-within .rsvp.quiet { display: flex; }
@media (hover: none) { .rsvp.quiet { display: flex; } }
.rsvp button { border: 0; border-radius: 999px; padding: 5px 14px; background: var(--fill); color: var(--ink); font-size: 13px; font-weight: 600; cursor: pointer; }
.rsvp button[aria-pressed="true"] { background: var(--blue); color: var(--on-color); }
.rsvp button:disabled { opacity: .5; }
.gap { grid-template-columns: 52px minmax(0, 1fr); padding-block: 6px; font-size: 13px; color: var(--green); }
.nowline { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 14px; align-items: center; padding: 2px 10px; color: var(--red); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.nowline::after { content: ""; height: 2px; border-radius: 2px; background: var(--red); }

/* Mail */
.mail { grid-template-columns: 8px minmax(0, 1fr) auto; align-items: start; }
.mail .dot { width: 8px; height: 8px; margin-top: 7px; border-radius: 50%; }
.mail.unread .dot { background: var(--blue); }
.mail .body { display: grid; gap: 1px; min-width: 0; }
.mail .line1 { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.mail .from { font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mail .n { font-size: 13px; color: var(--faint); }
.mail .title { font-weight: 400; color: var(--muted); }
.mail.unread .from { font-weight: 700; }
.mail.unread .title { font-weight: 600; color: var(--ink); }
.side { display: grid; justify-items: end; align-content: start; gap: 4px; }

/* Taken */
.group + .group { margin-top: 8px; }
.ghead { display: flex; align-items: center; gap: 8px; width: 100%; padding: 10px 18px 4px; border: 0; background: none; color: var(--c); font-size: 15px; font-weight: 700; text-align: left; cursor: pointer; }
.ghead .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ghead .n { font-size: 13px; font-weight: 500; color: var(--faint); }
.ghead svg { width: 14px; height: 14px; flex: none; transition: transform .15s ease; }
.ghead[aria-expanded="false"] svg { transform: rotate(-90deg); }
.task { grid-template-columns: 24px minmax(0, 1fr) auto; align-items: start; }
.tick { display: grid; place-items: center; width: 22px; height: 22px; margin-top: 1px; padding: 0; border-radius: 50%; border: 1.5px solid var(--faint); background: transparent; color: transparent; cursor: pointer; }
.tick:hover:not(:disabled) { border-color: var(--green); color: var(--green); }
.tick.on { border-color: var(--green); background: var(--green); color: var(--on-color); cursor: default; }
.tick:disabled:not(.on) { opacity: .3; cursor: default; }
.tick svg { width: 13px; height: 13px; }
.task.is-done .title { color: var(--faint); text-decoration: line-through; }
.due { font-size: 13px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.due.late { color: var(--red); font-weight: 600; }

/* Slack */
.sgroups { display: grid; gap: 4px; padding: 0 8px; }
.sgroup { display: grid; gap: 10px; padding: 12px 12px 14px; border-radius: 16px; min-width: 0; }
.sgroup:hover, .sgroup:focus-within { background: var(--hover); }
.shead { display: flex; align-items: center; gap: 8px; min-width: 0; }
.shead .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.sgroup.unread .shead .dot { background: var(--purple); }
.shead .where { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; font-weight: 700; color: var(--c); opacity: .7; }
.sgroup.unread .shead .where { opacity: 1; }
.shead .spacer { flex: 1; }
@media (max-width: 520px) { .shead { flex-wrap: wrap; } .shead .acts { flex-basis: 100%; margin-left: 8px; } }
.root { margin: 0 0 0 16px; padding-left: 12px; border-left: 2px solid var(--sep); font-size: 13px; color: var(--faint); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.smsgs { list-style: none; margin: 0 0 0 16px; padding: 0; display: grid; gap: 10px; }
.smsg { display: grid; gap: 2px; min-width: 0; }
.smsg .who { font-size: 13px; font-weight: 600; }
.smsg .who .date { margin-left: 8px; font-weight: 400; }
.smsg .snip { -webkit-line-clamp: 3; font-size: 15px; color: var(--ink); }
.sgroup:not(.unread) .smsg .snip { color: var(--muted); }
.reply { display: grid; gap: 10px; margin-left: 16px; }
.reply textarea { width: 100%; min-height: 72px; padding: 12px 14px; border: 1px solid var(--sep); border-radius: 14px; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font); resize: vertical; }
.reply textarea:focus { outline: none; border-color: var(--blue); }
.reply-acts { display: flex; justify-content: flex-end; gap: 8px; }

/* Briefing */
.brief { display: grid; gap: 12px; padding: 26px 28px 28px; }
@media (min-width: 760px) { .brief { padding: 34px 40px 36px; } }
.brief .eyebrow { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; font-weight: 600; color: var(--faint); }
.brief .eyebrow .old { color: var(--yellow); }
.brief h2 { margin: 0; max-width: 34ch; font-size: clamp(24px, 3.2vw, 32px); line-height: 1.15; font-weight: 700; letter-spacing: -0.025em; text-wrap: balance; }
.brief .summary { margin: 0; max-width: 70ch; font-size: 17px; color: var(--muted); }
.brief-cols { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; margin-top: 14px; }
@media (min-width: 900px) { .brief-cols { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 40px; } }
.brief h3 { margin: 0 0 12px; font-size: 15px; font-weight: 700; color: var(--yellow); }
.brief h3.h-act { color: var(--red); }
.brief h3.h-agenda { color: var(--blue); }
.brief ol, .brief ul { display: grid; gap: 14px; margin: 0; padding: 0; list-style: none; }
.prio { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 2px 8px; }
.prio .n { font-weight: 700; color: var(--yellow); font-variant-numeric: tabular-nums; }
.prio .t, .bitem .t { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.prio .w, .bitem .d { grid-column: 2; font-size: 13px; color: var(--muted); }
.bitem { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 2px 10px; align-items: baseline; }
.src { font-size: 13px; font-weight: 700; color: var(--faint); font-variant-numeric: tabular-nums; }
.src.s-mail { color: var(--orange); } .src.s-slack { color: var(--purple); } .src.s-monday { color: var(--green); } .src.s-agenda, .src.s-calendar, .src.s-time { color: var(--blue); }
.focus { margin-top: 16px; padding: 12px 14px; border-radius: 14px; background: var(--green-soft); font-size: 13px; }
.focus b { color: var(--green); }
.brief .issues { font-size: 13px; color: var(--faint); }
.brief-empty { display: grid; gap: 10px; }
.brief-empty p { margin: 0; max-width: 62ch; color: var(--muted); }
.brief-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-top: 6px; }
.brief-status { font-size: 13px; color: var(--muted); }

/* Live, plan, concept, per klant */
.controls { flex-wrap: wrap; justify-content: flex-end; }
.live { display: inline-flex; align-items: center; gap: 7px; margin-right: 4px; font-size: 13px; color: var(--faint); font-variant-numeric: tabular-nums; white-space: nowrap; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
@media (prefers-reduced-motion: no-preference) { .live i { animation: live 2.4s ease-out infinite; } }
@keyframes live { 0% { box-shadow: 0 0 0 0 var(--green-soft); } 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.live.stale i { background: var(--faint); animation: none; }
.planbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin: 0 16px 10px; padding: 12px 14px; border-radius: 16px; background: var(--green-soft); font-size: 13px; }
.planbar .grow { flex: 1; min-width: 14ch; }
.plan { grid-template-columns: 52px minmax(0, 1fr) auto; align-items: start; background: var(--green-soft); box-shadow: inset 0 0 0 1.5px var(--green); }
.plan:hover, .plan:focus-within { background: var(--green-soft); }
.plan.off { opacity: .5; background: transparent; box-shadow: inset 0 0 0 1.5px var(--sep); }
.plan .when { font-size: 15px; font-weight: 600; line-height: 1.35; color: var(--green); font-variant-numeric: tabular-nums; }
.plan .when span { display: block; font-size: 13px; font-weight: 400; color: var(--faint); }
.plan input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--green); }
.compose { grid-column: 1 / -1; display: grid; gap: 10px; margin-top: 8px; }
.compose textarea { width: 100%; min-height: 140px; padding: 12px 14px; border: 1px solid var(--sep); border-radius: 14px; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font); resize: vertical; }
.compose textarea:focus { outline: none; border-color: var(--blue); }
.compose .status { font-size: 13px; color: var(--muted); }
.compose-acts { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px; }
.compose-acts label { display: inline-flex; align-items: center; gap: 6px; margin-right: auto; font-size: 13px; color: var(--muted); }
.compose-acts input { width: 16px; height: 16px; margin: 0; accent-color: var(--blue); }
.clients { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 980px) { .clients { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; } }
.clients-head { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; font-size: 13px; color: var(--muted); }
.clients-head .grow { flex: 1; min-width: 20ch; }
.client .tile-head h2 { color: var(--ink); }
.client.other .tile-head h2 { color: var(--muted); }
.client .sum { font-size: 13px; color: var(--muted); }
.csec + .csec { margin-top: 10px; }
.csec h3 { margin: 4px 18px; font-size: 13px; font-weight: 700; color: var(--c); }
.csec.s-agenda { --c: var(--blue); } .csec.s-mail { --c: var(--orange); } .csec.s-tasks { --c: var(--green); } .csec.s-slack { --c: var(--purple); }
.csec .more { margin: 2px 18px 4px; font-size: 13px; color: var(--faint); }
.mt { grid-template-columns: 92px minmax(0, 1fr); }
.mt .when { padding-top: 2px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Toast */
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 10; transform: translateX(-50%); display: flex; align-items: center; gap: 14px; width: max-content; max-width: calc(100% - 32px); padding: 11px 14px 11px 18px; border-radius: 999px; background: var(--toast); color: var(--toast-ink); font-size: 14px; box-shadow: 0 10px 30px rgba(0, 0, 0, .3); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
.toast.crit { background: rgba(140, 20, 30, .92); }
.toast span { min-width: 0; overflow-wrap: anywhere; }
.toast .tbtn { flex: none; padding: 4px 8px; border: 0; border-radius: 999px; background: transparent; color: var(--toast-accent); font-weight: 600; cursor: pointer; }
.toast .tbtn:hover { background: rgba(255, 255, 255, .1); }
</style>
<script>try { if (localStorage.getItem("ld:mode") === "light") document.documentElement.setAttribute("data-mode", "light"); } catch (e) { /* storage unavailable */ }</script>

<div class="wrap">
  <header class="top">
    <div class="day">
      <span class="wd" id="mast-eyebrow">vandaag</span>
      <h1 id="mast-date">Vandaag</h1>
    </div>
    <div class="controls">
      <span class="live stale" id="live" title="Ververst automatisch zolang de pagina openstaat"><i></i><span id="live-time">Live</span></span>
      <div class="seg" role="group" aria-label="Indeling">
        <button type="button" data-view="sources" aria-pressed="true">Bronnen</button>
        <button type="button" data-view="clients" aria-pressed="false">Klanten</button>
      </div>
      <div class="seg" role="group" aria-label="Weergave">
        <button type="button" data-mode="light" aria-pressed="false" aria-label="Licht" title="Licht" data-icon="sun"></button>
        <button type="button" data-mode="dark" aria-pressed="true" aria-label="Donker" title="Donker" data-icon="moon"></button>
      </div>
      <button class="round" id="refresh-all" type="button" aria-label="Alles verversen" title="Alles verversen" data-icon="refresh"></button>
    </div>
  </header>

  <nav class="counts" aria-label="Overzicht">
    <a class="count" href="#agenda" style="--c: var(--blue)"><span class="ic" data-icon="calendar"></span><b id="st-meet">–</b><span class="lbl">Afspraken</span></a>
    <a class="count" href="#mail" style="--c: var(--orange)"><span class="ic" data-icon="mail"></span><b id="st-unread">–</b><span class="lbl">Ongelezen</span></a>
    <a class="count" href="#tasks" id="st-wait-wrap" style="--c: var(--green)"><span class="ic" data-icon="tasks"></span><b id="st-wait">–</b><span class="lbl">Wacht op jou</span></a>
    <a class="count" href="#slack" style="--c: var(--purple)"><span class="ic" data-icon="chat"></span><b id="st-slack">–</b><span class="lbl">Slack</span></a>
  </nav>

  <section class="tile brief" id="briefing" aria-label="Ochtendbriefing">
    <div class="brief-empty"><span class="eyebrow">Ochtendbriefing</span><h2>Briefing laden…</h2></div>
  </section>

  <main class="board" id="board">
    <section class="tile" id="agenda" aria-labelledby="h-agenda">
      <div class="tile-head">
        <h2 id="h-agenda"><span class="ic" data-icon="calendar"></span>Agenda</h2>
        <div class="end">
          <button class="btn" type="button" id="plan-day">Plan mijn dag</button>
          <button class="btn" type="button" id="day-today" hidden>Vandaag</button>
          <button class="ib" type="button" id="day-prev" aria-label="Vorige dag" title="Vorige dag" data-icon="chevL"></button>
          <span class="daylbl" id="day-label">Vandaag</span>
          <button class="ib" type="button" id="day-next" aria-label="Volgende dag" title="Volgende dag" data-icon="chevR"></button>
        </div>
      </div>
      <div class="scroll" id="b-agenda"><div class="skel"><i></i><i></i><i></i><i></i><i></i></div></div>
    </section>

    <section class="tile" id="mail" aria-labelledby="h-mail">
      <div class="tile-head">
        <h2 id="h-mail"><span class="ic" data-icon="mail"></span>Mail</h2>
        <div class="end">
          <div class="seg" role="group" aria-label="Mailfilter">
            <button type="button" data-mail="all" aria-pressed="true">Inbox</button>
            <button type="button" data-mail="unread" aria-pressed="false">Ongelezen</button>
            <button type="button" data-mail="important" aria-pressed="false">Belangrijk</button>
          </div>
        </div>
      </div>
      <div id="b-mail"><div class="skel"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
      <div class="tile-foot">
        <button class="ib" type="button" id="mail-prev" aria-label="Vorige 8 mails" title="Vorige 8" data-icon="chevL" disabled></button>
        <span id="mail-range">1–8</span>
        <button class="ib" type="button" id="mail-next" aria-label="Volgende 8 mails" title="Volgende 8" data-icon="chevR" disabled></button>
      </div>
    </section>

    <section class="tile" id="tasks" aria-labelledby="h-tasks">
      <div class="tile-head">
        <h2 id="h-tasks"><span class="ic" data-icon="tasks"></span>Taken</h2>
        <div class="end">
          <div class="seg" role="group" aria-label="Takenfilter">
            <button type="button" data-tasks="mine" aria-pressed="true">Aandacht</button>
            <button type="button" data-tasks="open" aria-pressed="false">Open</button>
            <button type="button" data-tasks="all" aria-pressed="false">Alles</button>
          </div>
        </div>
      </div>
      <div class="scroll" id="b-tasks"><div class="skel"><i></i><i></i><i></i><i></i></div></div>
    </section>

    <section class="tile" id="slack" aria-labelledby="h-slack">
      <div class="tile-head">
        <h2 id="h-slack"><span class="ic" data-icon="chat"></span>Slack</h2>
        <div class="end">
          <div class="seg" role="group" aria-label="Slackfilter">
            <button type="button" data-slack="unread" aria-pressed="true">Ongelezen</button>
            <button type="button" data-slack="all" aria-pressed="false">Alles</button>
          </div>
        </div>
      </div>
      <div class="scroll" id="b-slack"><div class="skel"><i></i><i></i><i></i></div></div>
    </section>
  </main>
  <section class="clients" id="clients" aria-label="Per klant" hidden></section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script>
(() => {
  "use strict";

  const TZ = "Europe/Amsterdam";
  const SV = { cal: "Google Calendar", mail: "Gmail", monday: "monday.com", slack: "Slack" };
  const SLACK_ME = "U05GUG7LL2W";
  const MAIL_PAGE = 8;
  const DENIALS = new Set(["needs_reauth", "server_not_connected", "server_not_found", "selection_required", "not_in_manifest", "blocked_by_policy", "approval_required", "consent_required", "not_granted", "capability_disabled", "capability_removed"]);
  const WATCH_CACHE = { staleTime: 60000, gcTime: 86400000 };
  const OVERLAY_MS = 180000;

  let mcp = null, permissions = null, sampleFn = null, dbApi = null;
  let view = "sources";

  // ---------- helpers ----------
  const $ = (id) => document.getElementById(id);
  function el(tag, props, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (v == null || v === false) continue;
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? "" : String(v));
    }
    for (const c of kids.flat()) {
      if (c == null || c === false) continue;
      n.append(c.nodeType ? c : document.createTextNode(String(c)));
    }
    return n;
  }
  const ICONS = {
    refresh: '<path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.5 2.5v3h-3"/>',
    chevL: '<path d="M10 3.5 5.5 8l4.5 4.5"/>',
    chevR: '<path d="M6 3.5 10.5 8 6 12.5"/>',
    chevD: '<path d="M3.5 6 8 10.5 12.5 6"/>',
    check: '<path d="M3.5 8.5 6.5 11.5 12.5 4.5"/>',
    mail: '<rect x="2" y="3.5" width="12" height="9" rx="1.8"/><path d="m2.8 4.6 5.2 4.1 5.2-4.1"/>',
    mailOpen: '<path d="M2 6.6 8 2.8l6 3.8V13H2z"/><path d="m2.4 6.9 5.6 4 5.6-4"/>',
    archive: '<rect x="2" y="2.8" width="12" height="3.4" rx="1"/><path d="M3.2 6.2v6.6h9.6V6.2M6.4 8.8h3.2"/>',
    trash: '<path d="M2.8 4.4h10.4M6.2 4.4V2.8h3.6v1.6M4.2 4.4l.7 8.8h6.2l.7-8.8"/>',
    reply: '<path d="M6.5 3.5 2.8 7.2 6.5 11"/><path d="M3.2 7.2h5.6a4.4 4.4 0 0 1 4.4 4.4v.9"/>',
    circleCheck: '<circle cx="8" cy="8" r="5.8"/><path d="m5.6 8.2 1.7 1.7 3.2-3.6"/>',
    dot: '<circle cx="8" cy="8" r="2.6" fill="currentColor" stroke="none"/><circle cx="8" cy="8" r="5.8"/>',
    ring: '<circle cx="8" cy="8" r="5.8"/>',
    external: '<path d="M9 3h4v4M13 3 7.5 8.5"/><path d="M11.5 9.5V13h-8.5V4.5H6.5"/>',
    sun: '<circle cx="8" cy="8" r="2.8"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1"/>',
    moon: '<path d="M13.2 9.6A5.6 5.6 0 0 1 6.4 2.8a5.6 5.6 0 1 0 6.8 6.8z"/>',
    calendar: '<rect x="2.5" y="3.2" width="11" height="10.3" rx="2.2"/><path d="M2.5 6.6h11M5.5 1.8v2.6M10.5 1.8v2.6"/>',
    tasks: '<path d="m2.4 4.4 1.3 1.3 2.1-2.4M2.4 10.4l1.3 1.3 2.1-2.4M8.2 4.8h5.4M8.2 10.8h5.4"/>',
    sparkle: '<path d="M7.2 2.2 8.5 5.6l3.4 1.3-3.4 1.3-1.3 3.4-1.3-3.4-3.4-1.3 3.4-1.3z"/><path d="m12.4 10.2.6 1.5 1.5.6-1.5.6-.6 1.5-.6-1.5-1.5-.6 1.5-.6z"/>',
    close: '<path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/>',
    chat: '<path d="M3.2 3h9.6A1.7 1.7 0 0 1 14.5 4.7v5.2a1.7 1.7 0 0 1-1.7 1.7H7.4L4.3 14v-2.4H3.2a1.7 1.7 0 0 1-1.7-1.7V4.7A1.7 1.7 0 0 1 3.2 3z"/>',
  };
  function icon(name) {
    const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    s.setAttribute("viewBox", "0 0 16 16"); s.setAttribute("aria-hidden", "true"); s.setAttribute("fill", "none");
    s.setAttribute("stroke", "currentColor"); s.setAttribute("stroke-width", "1.5");
    s.setAttribute("stroke-linecap", "round"); s.setAttribute("stroke-linejoin", "round");
    s.innerHTML = ICONS[name] || "";
    return s;
  }
  document.querySelectorAll("[data-icon]").forEach((b) => b.prepend(icon(b.dataset.icon)));
  const iconBtn = (name, label, onclick) => el("button", { class: "ib", type: "button", "aria-label": label, title: label, onclick }, icon(name));
  const ext = (href, props, ...kids) => el("a", Object.assign({ href, target: "_blank", rel: "noopener noreferrer" }, props), ...kids);
  const safeUrl = (u) => (typeof u === "string" && /^https:\/\//i.test(u) ? u : null);
  function decode(s) { const t = document.createElement("textarea"); t.innerHTML = String(s || ""); return t.value; }
  const clip = (s, n) => { s = String(s || "").replace(/\s+/g, " ").trim(); return s.length > n ? s.slice(0, n - 1) + "…" : s; };
  const store = {
    get(k, d) { try { const v = localStorage.getItem("ld:" + k); return v == null ? d : v; } catch { return d; } },
    set(k, v) { try { localStorage.setItem("ld:" + k, v); } catch { /* storage unavailable */ } },
  };
  // Short-lived local truth for actions, so a row reflects your click before the service catches up.
  function overlay() {
    const m = new Map();
    return {
      set(k, v) { m.set(k, { v, at: Date.now() }); },
      get(k) { const x = m.get(k); if (!x) return undefined; if (Date.now() - x.at > OVERLAY_MS) { m.delete(k); return undefined; } return x.v; },
      del(k) { m.delete(k); },
    };
  }

  // ---------- dates (Europe/Amsterdam) ----------
  const ymdFmt = new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" });
  const hmFmt = new Intl.DateTimeFormat("nl-NL", { timeZone: TZ, hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
  const shortFmt = new Intl.DateTimeFormat("nl-NL", { timeZone: TZ, day: "numeric", month: "short" });
  const ymd = (d) => ymdFmt.format(d);
  const today = () => ymd(new Date());
  const utcOf = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d)); };
  const addDays = (s, n) => { const t = utcOf(s); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); };
  const weekday = (s) => utcOf(s).getUTCDay();
  const dayLong = (s, opts) => new Intl.DateTimeFormat("nl-NL", Object.assign({ timeZone: "UTC" }, opts)).format(utcOf(s));
  function minuteOfDay(d) {
    const p = hmFmt.formatToParts(d);
    return (+p.find((x) => x.type === "hour").value) * 60 + (+p.find((x) => x.type === "minute").value);
  }
  const hm = (d) => hmFmt.format(d);
  const mm = (m) => String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
  function dur(m) { const h = Math.floor(m / 60), r = m % 60; return (h ? h + "u" : "") + (r ? (h ? " " : "") + r + "m" : ""); }
  function relDate(d) {
    if (!(d instanceof Date) || isNaN(d)) return "";
    const t = today(), dy = ymd(d);
    if (dy === t) return hm(d);
    if (dy === addDays(t, -1)) return "gisteren";
    return shortFmt.format(d).replace(".", "");
  }
  function dayLabel(s) {
    const t = today();
    if (s === t) return "Vandaag";
    if (s === addDays(t, 1)) return "Morgen";
    if (s === addDays(t, -1)) return "Gisteren";
    return dayLong(s, { weekday: "short", day: "numeric", month: "short" }).replace(".", "");
  }
  function nextBriefingText() {
    const now = new Date(), t = today();
    const wd = weekday(t);
    if (wd >= 1 && wd <= 5 && minuteOfDay(now) < 6 * 60 + 45) return "vandaag om 06:45";
    let d = addDays(t, 1);
    while (weekday(d) === 0 || weekday(d) === 6) d = addDays(d, 1);
    return (d === addDays(t, 1) ? "morgen" : dayLong(d, { weekday: "long" })) + " om 06:45";
  }

  // ---------- light / dark ----------
  function applyMode(mode) {
    if (mode === "light") document.documentElement.setAttribute("data-mode", "light");
    else document.documentElement.removeAttribute("data-mode");
    document.querySelectorAll("[data-mode]").forEach((b) => { if (b.tagName === "BUTTON") b.setAttribute("aria-pressed", String(b.dataset.mode === mode)); });
  }
  applyMode(store.get("mode", "dark") === "light" ? "light" : "dark");
  document.querySelectorAll("button[data-mode]").forEach((b) => b.addEventListener("click", () => { store.set("mode", b.dataset.mode); applyMode(b.dataset.mode); }));

  // ---------- masthead ----------
  function renderMast() {
    const t = today();
    $("mast-eyebrow").textContent = dayLong(t, { weekday: "long" });
    $("mast-date").textContent = dayLong(t, { day: "numeric", month: "long" });
  }
  renderMast();
  const counts = { meet: null, unread: null, wait: null, slack: null };
  function renderStats() {
    const show = (id, v) => { $(id).textContent = v == null ? "–" : String(v); };
    show("st-meet", counts.meet); show("st-unread", counts.unread); show("st-wait", counts.wait); show("st-slack", counts.slack);
    $("st-wait-wrap").classList.toggle("hot", !!counts.wait);
  }

  // ---------- feedback ----------
  let toastTimer = null;
  function hideToast() { $("toast").hidden = true; }
  function toast(text, opts) {
    opts = opts || {};
    const t = $("toast");
    t.replaceChildren(el("span", { text }));
    t.className = "toast" + (opts.tone ? " " + opts.tone : "");
    if (opts.undo) t.append(el("button", { class: "tbtn", type: "button", text: "Ongedaan maken", onclick: () => { hideToast(); opts.undo(); } }));
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, opts.undo ? 8000 : 4500);
  }
  async function openPermissions() {
    try { if (permissions) await permissions.manage(); else throw new Error(); }
    catch { toast("Open het menu Permissions van dit dashboard in claude.ai om de koppeling weer aan te zetten."); }
  }
  // A failed read: the one message and action that fixes it.
  function problem(server, err, handlers) {
    const code = (err && err.code) || "upstream_error";
    let text, action = null, tone = "";
    switch (code) {
      case "needs_reauth":
        text = server + " moet opnieuw verbonden worden. Ga in claude.ai naar Instellingen → Connectors en verbind " + server + " opnieuw."; tone = "crit"; break;
      case "server_not_connected": case "server_not_found":
        text = server + " is niet gekoppeld. Voeg het toe in claude.ai via Instellingen → Connectors."; tone = "crit"; break;
      case "selection_required":
        text = "Je hebt meer dan één " + server + "-koppeling. Kies er één in de melding van Claude en laad de pagina opnieuw."; break;
      case "not_in_manifest": case "consent_required":
        text = server + " staat uit voor dit dashboard."; action = ["Rechten beheren", openPermissions]; break;
      case "blocked_by_policy":
        text = "Je organisatie staat " + server + " hier niet toe."; tone = "crit"; break;
      case "approval_required":
        text = server + " vraagt eerst om jouw akkoord."; if (handlers.approve) action = ["Toestaan", handlers.approve]; break;
      case "not_granted": case "capability_disabled": case "capability_removed":
        text = "Live gegevens zijn niet beschikbaar in deze weergave. Open het dashboard in claude.ai."; break;
      case "tool_error":
        text = server + " gaf een fout terug: " + (err.message || "onbekende fout") + "."; if (handlers.retry) action = ["Opnieuw", handlers.retry]; break;
      default:
        text = server + " reageert nu niet."; if (handlers.retry) action = ["Opnieuw", handlers.retry];
    }
    const n = el("div", { class: "note" + (tone ? " " + tone : ""), role: "status" }, el("span", { text }));
    if (action) n.append(el("button", { class: "btn", type: "button", text: action[0], onclick: action[1] }));
    return n;
  }
  // A failed action.
  function actionProblem(server, e) {
    const c = e && e.code;
    if (c === "needs_reauth") return server + " moet opnieuw verbonden worden (claude.ai → Instellingen → Connectors).";
    if (c === "server_not_connected" || c === "server_not_found") return server + " is niet gekoppeld.";
    if (c === "not_in_manifest" || c === "consent_required") return "Deze actie staat uit voor " + server + ". Zet hem aan via het menu Permissions.";
    if (c === "approval_required") return "Je hebt deze actie niet bevestigd, er is niets veranderd.";
    if (c === "blocked_by_policy") return "Je organisatie staat deze actie niet toe.";
    if (c === "tool_error") return server + " weigerde: " + clip(e.message || "onbekende fout", 140);
    if (c === "server_unavailable" || c === "upstream_error") return server + " reageerde niet. Ververs om te zien of het toch gelukt is.";
    return "Dat lukte niet. Probeer het opnieuw.";
  }
  // Runs one write on a connector: show the result at once, roll back if the service says no.
  async function act({ server, tool, input, apply, revert, done, after, btn }) {
    if (!mcp) { toast("Acties werken alleen in claude.ai.", { tone: "crit" }); return false; }
    if (btn) btn.disabled = true;
    if (apply) apply();
    try {
      await mcp.callTool(server, tool, input, { cache: false });
      if (done) done();
      if (after) setTimeout(after, 1500);
      return true;
    } catch (e) {
      if (revert) revert();
      toast(actionProblem(server, e), { tone: "crit" });
      if (after && e && (e.code === "server_unavailable" || e.code === "upstream_error")) setTimeout(after, 1500);
      return false;
    } finally {
      if (btn && btn.isConnected) btn.disabled = false;
    }
  }

  // ---------- live widgets ----------
  function setFresh() { /* per-tile time stamps removed */ }
  function setCount() { /* per-tile counts removed; the count tiles carry the totals */ }
  const stampOf = (result) => (result && result.cache && result.cache.storedAt) || Date.now();

  // Live indicator: the newest moment any source was refreshed.
  let lastLive = 0;
  function markLive(ts) { if (ts && ts > lastLive) lastLive = ts; renderLive(); }
  function renderLive() {
    const live = $("live");
    if (!live) return;
    $("live-time").textContent = lastLive ? "Live · " + hm(new Date(lastLive)) : "Live";
    live.classList.toggle("stale", !lastLive || Date.now() - lastLive > 10 * 60000);
  }
  setInterval(renderLive, 30000);
  // Re-rendering while you type would take the cursor away: wait until focus leaves the text box.
  function deferIfTyping(container, redo) {
    const a = document.activeElement;
    if (!container || !a || !container.contains(a) || !(a.closest && a.closest(".reply, .compose"))) return false;
    if (!container._deferred) {
      container._deferred = true;
      const onOut = () => setTimeout(() => {
        const b = document.activeElement;
        if (b && container.contains(b) && b.closest && b.closest(".reply, .compose")) return;
        container.removeEventListener("focusout", onOut);
        container._deferred = false;
        redo();
      }, 250);
      container.addEventListener("focusout", onOut);
    }
    return true;
  }
  let clientsQueued = false;
  function afterRender() {
    if (view !== "clients" || clientsQueued) return;
    clientsQueued = true;
    setTimeout(() => { clientsQueued = false; renderClients(); }, 0);
  }

  // Watches one connector tool; keeps last-good data on hiccups, drops it when access is gone.
  function widget(key, server, draw) {
    const w = { key, server, tool: null, input: null, interval: 300000, data: null, err: null, at: null, unsub: null, retried: false };
    w.render = (force) => {
      const body = $("b-" + key);
      if (!force && deferIfTyping(body, () => w.render(true))) return;
      body.replaceChildren();
      if (w.err) body.append(problem(server, w.err, { retry: () => w.refresh(), approve: () => w.approve() }));
      if (w.data != null) body.append(draw(w.data, w));
      else if (!w.err) body.append(el("div", { class: "skel" }, el("i"), el("i"), el("i"), el("i")));
      setFresh(key, w.data != null ? w.at : null);
      afterRender();
    };
    w.watch = (tool, input, interval) => {
      if (w.unsub) w.unsub();
      w.tool = tool; w.input = input; w.interval = interval || w.interval; w.retried = false;
      if (!mcp) return;
      w.unsub = mcp.watchTool(server, tool, input, (ev) => {
        if (ev.type === "data") {
          w.data = ev.result.payload; w.at = stampOf(ev.result); w.err = null; w.retried = false;
          markLive(w.at);
        } else {
          const e = ev.error || {};
          w.err = e;
          if (DENIALS.has(e.code)) w.data = null;
          if (e.retryable && !w.retried) {
            w.retried = true;
            setTimeout(() => mcp.invalidate(server, tool, input).catch(() => {}), (e.retryAfterMs || 0) + 800 + Math.random() * 1600);
          }
        }
        w.render();
      }, { cache: WATCH_CACHE, refetchInterval: w.interval });
    };
    w.refresh = () => {
      if (!mcp || !w.tool) return;
      w.retried = false;
      mcp.invalidate(server, w.tool, w.input).catch(() => w.watch(w.tool, w.input, w.interval));
    };
    w.approve = async () => {
      try { const r = await mcp.callTool(server, w.tool, w.input); w.data = r.payload; w.at = stampOf(r); w.err = null; }
      catch (e) { w.err = e; }
      w.render();
    };
    w.fail = (e) => { w.err = e; w.data = null; w.render(); };
    return w;
  }

  // ---------- Agenda ----------
  let calDay = today();
  let myEmail = null;
  const calOv = overlay();

  function parseSlack(payload, kind) {
    const md = payload && typeof payload === "object" ? payload.results : typeof payload === "string" ? payload : "";
    if (!md) return [];
    return String(md).split(/^### Result \d+ of \d+\s*$/m).slice(1).map((b) => {
      const get = (re) => { const m = b.match(re); return m ? m[1].trim() : ""; };
      const channelRaw = get(/^Channel: (.*)$/m);
      const channelId = (channelRaw.match(/\(ID: ([^)]+)\)\s*$/) || [])[1] || "";
      const channel = channelRaw.replace(/\s*\(ID: [^)]*\)\s*$/, "");
      const participants = get(/^Participants: (.*)$/m);
      const fromRaw = get(/^From: (.*)$/m);
      const fromId = (fromRaw.match(/\(ID: ([^)]+)\)/) || [])[1] || "";
      const fromName = fromRaw.replace(/\s*\(ID: [^)]*\)\s*$/, "").replace(/\s*<[^>]*>\s*$/, "").trim();
      const tsStr = get(/^Message_ts: (.*)$/m);

      const threadTs = (permalink.match(/[?&]thread_ts=([\d.]+)/) || [])[1] || "";

      const text = i >= 0 ? b.slice(i + 6).replace(/^[ \t]*\n/, "").replace(/\n*-{3}\s*$/, "") : "";

      if (isDm) {

    return el("li", { class: "row plan" + (b.on ? "" : " off") },
      el("div", { class: "when" }, mm(b.s), el("span", { text: mm(b.e) })),
      el("div", { style: "min-width:0" }, el("div", { class: "title", text: b.title }), b.why ? el("div", { class: "meta", text: b.why }) : null),
      cb);
  }
  async function applyPlan(btn) {
    if (!plan || !mcp) return;
    const p = plan, chosen = p.blocks.filter((b) => b.on);
    if (!chosen.length) return;
    btn.disabled = true; btn.textContent = "Bezig…";
    const created = [];
    for (const b of chosen) {
      const links = b.tasks.map((x) => "• " + x.item.name + (x.item.url ? " – " + x.item.url : "")).join("\n");
      const input = { summary: "Focus: " + b.title, startTime: p.day + "T" + mm(b.s) + ":00", endTime: p.day + "T" + mm(b.e) + ":00",
        description: "Gepland met Life Dashboard." + (links ? "\n\n" + links : ""), colorId: "2", notificationLevel: "NONE" };
      try {
        const r = await mcp.callTool(SV.cal, "create_event", input, { cache: false });
        const pl = r && r.payload;
        created.push({ id: (pl && (pl.id || (pl.event && pl.event.id))) || null, summary: input.summary, start: input.startTime });
      } catch (e) {
        toast(actionProblem(SV.cal, e), { tone: "crit" });
        break;
      }
    }
    plan = null;
    cal.render(true);
    setTimeout(() => { cal.refresh(); calWeek.refresh(); }, 1200);
    if (created.length) toast(created.length + (created.length === 1 ? " focusblok staat" : " focusblokken staan") + " in je agenda.", { undo: () => undoPlan(created, p.day) });
  }
  async function undoPlan(created, day) {
    const ids = created.map((c) => c.id).filter(Boolean);
    if (ids.length < created.length) {
      try {
        const r = await mcp.callTool(SV.cal, "list_events", { startTime: day + "T00:00:00", endTime: addDays(day, 1) + "T00:00:00", orderBy: "startTime", pageSize: 100 }, { cache: false });
        const evs = (r.payload && r.payload.events) || [];
        for (const c of created) {
          if (c.id) continue;
          const hit = evs.find((ev) => ev.summary === c.summary && ev.start && ev.start.dateTime && ev.start.dateTime.slice(0, 16) === c.start.slice(0, 16));
          if (hit) ids.push(hit.id);
        }
      } catch (e) { /* remove the ones we know */ }
    }
    let n = 0;
    for (const id of ids) {
      try { await mcp.callTool(SV.cal, "delete_event", { eventId: id, notificationLevel: "NONE" }, { cache: false }); n++; }
      catch (e) { toast(actionProblem(SV.cal, e), { tone: "crit" }); break; }
    }
    cal.refresh(); calWeek.refresh();
    if (n) toast(n === 1 ? "Focusblok verwijderd." : n + " focusblokken verwijderd.");
  }
  $("plan-day").addEventListener("click", makePlan);

  // ---------- Per klant ----------
  view = store.get("view", "sources") === "clients" ? "clients" : "sources";
  let clientsCfg = null, clientsCompiled = [], clientsBusy = false, clientsMsg = "";
  const calWeek = widget("week", SV.cal, () => el("span"));
  const mailAll = widget("mailall", SV.mail, () => el("span"));
  calWeek.render = () => afterRender();
  mailAll.render = () => afterRender();
  let clientWatching = false;
  function startClientWatches() {
    if (clientWatching || !mcp) return;
    clientWatching = true;
    const t = today();
    calWeek.watch("list_events", { startTime: t + "T00:00:00", endTime: addDays(t, 7) + "T00:00:00", orderBy: "startTime", pageSize: 250 }, 300000);
    mailAll.watch("search_threads", { query: "in:inbox newer_than:14d", pageSize: 50 }, 120000);
  }
  function setView(v) {
    view = v === "clients" ? "clients" : "sources";
    store.set("view", view);
    document.querySelectorAll("button[data-view]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.view === view)));
    $("board").hidden = view === "clients";
    $("clients").hidden = view !== "clients";
    if (view === "clients") { startClientWatches(); renderClients(true); }
  }
  document.querySelectorAll("button[data-view]").forEach((b) => b.addEventListener("click", () => setView(b.dataset.view)));
  document.querySelectorAll("a.count").forEach((a) => a.addEventListener("click", () => { if (view === "clients") setView("sources"); }));
  const escRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const OWN = new Set(["thebrandfather.nl"]);
  const domainOf = (addr) => { const m = String(addr || "").toLowerCase().match(/@([a-z0-9.-]+)/); return m ? m[1] : ""; };
  function compileClients(list) {
    return (list || []).map((c) => {
      const kws = (Array.isArray(c.keywords) ? c.keywords : []).map((k) => String(k).trim()).filter((k) => k.length >= 2).map(escRe);
      return {
        name: String(c.name || "").trim(),
        domains: (Array.isArray(c.domains) ? c.domains : []).map((d) => String(d).toLowerCase().trim()).filter(Boolean),
        re: kws.length ? new RegExp("(?:^|[^\\p{L}\\p{N}])(?:" + kws.join("|") + ")(?=$|[^\\p{L}\\p{N}])", "iu") : null,
      };
    }).filter((c) => c.name);
  }
  function matchClient(text, domains) {
    const mine = domainOf(myEmail);
    const ds = domains.filter((d) => d && !OWN.has(d) && d !== mine);
    for (const c of clientsCompiled) if (ds.some((d) => c.domains.some((cd) => d === cd || d.endsWith("." + cd)))) return c.name;
    for (const c of clientsCompiled) if (c.re && c.re.test(text)) return c.name;
    return null;
  }
  function eventInfo(ev) {
    const timed = !!(ev.start && ev.start.dateTime);
    const me = (ev.attendees || []).find((a) => a.self) || null;
    const rsvp = calOv.get(ev.id) || (me ? me.responseStatus : "accepted");
    return { ev, me, rsvp, declined: rsvp === "declined", allDay: !timed,
      s: timed ? new Date(ev.start.dateTime) : null, e: timed ? new Date((ev.end && ev.end.dateTime) || ev.start.dateTime) : null,
      day: timed ? ymd(new Date(ev.start.dateTime)) : ((ev.start && ev.start.date) || today()) };
  }
  const threadUnread = (t) => { const ov = mailOv.get(t.id) || {}; return ov.unread != null ? ov.unread : (t.messages || []).some((m) => (m.labelIds || []).includes("UNREAD")); };
  const lastDate = (t) => { const ms = t.messages || []; return new Date((ms[ms.length - 1] || {}).date || 0).getTime() || 0; };
  function clientBuckets() {
    const buckets = new Map(clientsCompiled.map((c) => [c.name, { name: c.name, meetings: [], mails: [], tasks: [], slack: [] }]));
    const other = { name: "Overig", other: true, meetings: [], mails: [], tasks: [], slack: [] };
    const put = (name, kind, item) => (buckets.get(name) || other)[kind].push(item);
    const now = new Date();
    for (const ev of (calWeek.data && Array.isArray(calWeek.data.events) ? calWeek.data.events : [])) {
      if (ev.status === "cancelled") continue;
      const r = eventInfo(ev);
      if (r.declined || (!r.allDay && r.e < now)) continue;
      put(matchClient([ev.summary, ev.location, clip(ev.description, 400)].join(" "), (ev.attendees || []).map((a) => domainOf(a.email))), "meetings", r);
    }
    const seen = new Set();
    for (const t of [].concat((mailAll.data && mailAll.data.threads) || [], (mail.data && mail.data.threads) || [])) {
      if (!t || seen.has(t.id) || (mailOv.get(t.id) || {}).gone) continue;
      seen.add(t.id);
      const msgs = t.messages || [];
      const doms = msgs.flatMap((m) => [m.sender].concat(m.toRecipients || [], m.ccRecipients || [])).map((a) => domainOf(emailOf(a)));
      put(matchClient(msgs.map((m) => decode(m.subject || "") + " " + decode(m.snippet || "")).join(" "), doms), "mails", t);
    }
    for (const x of taskList(tasks.data)) {
      if (x.done) continue;
      const meta = boardMeta[x.boardId] || {};
      put(matchClient([meta.ws, meta.name, x.item.group && x.item.group.title, x.item.name].join(" "), []), "tasks", x);
    }
    for (const g of slackGroups()) put(matchClient([g.where, (roots.get(g.key) || {}).text || "", g.msgs.map((m) => m.text).join(" ")].join(" "), []), "slack", g);
    return { list: [...buckets.values()], other };
  }
  function bucketScore(b) {
    const t = today();
    return b.tasks.reduce((s, x) => s + (x.waiting ? 5 : 0) + (x.stuck ? 3 : 0) + (x.late ? 3 : 0) + (x.soon ? 2 : 0), 0)
      + b.mails.filter(threadUnread).length * 2 + b.slack.filter((g) => !g.read).length * 2
      + b.meetings.filter((r) => r.day === t).length * 2
      + (b.meetings.length + b.mails.length + b.tasks.length + b.slack.length) * 0.1;
  }
  function meetingRow(r) {
    const when = dayLabel(r.day) + (r.allDay ? "" : " " + hm(r.s));
    const title = safeUrl(r.ev.htmlLink) ? ext(r.ev.htmlLink, { class: "title", text: r.ev.summary || "(geen titel)" }) : el("span", { class: "title", text: r.ev.summary || "(geen titel)" });
    return el("li", { class: "row mt" }, el("span", { class: "when", text: when }), el("div", { style: "min-width:0" }, title, rsvpControl(r)));
  }
  function clientTile(b) {
    const parts = [[b.meetings.length, "afspraak", "afspraken"], [b.mails.length, "mail", "mails"], [b.tasks.length, "taak", "taken"], [b.slack.length, "Slack-gesprek", "Slack-gesprekken"]]
      .filter(([n]) => n).map(([n, one, many]) => n + " " + (n === 1 ? one : many));
    const tile = el("section", { class: "tile client" + (b.other ? " other" : "") },
      el("div", { class: "tile-head" }, el("h2", { text: b.name }), el("span", { class: "sum", text: parts.join(" · ") })));
    const more = (n, max) => (n > max ? el("p", { class: "more", text: "Nog " + (n - max) + " meer" }) : null);
    const sec = (kind, label, ...content) => el("div", { class: "csec s-" + kind }, el("h3", { text: label }), ...content);
    if (b.meetings.length) {
      const ms = b.meetings.slice().sort((x, y) => (x.s ? x.s.getTime() : utcOf(x.day).getTime()) - (y.s ? y.s.getTime() : utcOf(y.day).getTime()));
      tile.append(sec("agenda", "Agenda", el("ul", { class: "list" }, ms.slice(0, 4).map(meetingRow)), more(ms.length, 4)));
    }
    if (b.mails.length) {
      const ms = b.mails.slice().sort((x, y) => (threadUnread(y) - threadUnread(x)) || (lastDate(y) - lastDate(x)));
      tile.append(sec("mail", "Mail", el("ul", { class: "list" }, ms.slice(0, 5).map(mailRow)), more(ms.length, 5)));
    }
    if (b.tasks.length) {
      const ts = b.tasks.slice().sort((x, y) => y.score - x.score);
      tile.append(sec("tasks", "Taken", el("ul", { class: "list" }, ts.slice(0, 6).map(taskRow)), more(ts.length, 6)));
    }
    if (b.slack.length) {
      const gs = b.slack.slice().sort((x, y) => (x.read - y.read) || (y.latest - x.latest));
      tile.append(sec("slack", "Slack", el("div", { class: "sgroups" }, gs.slice(0, 3).map(slackGroup)), more(gs.length, 3)));
    }
    return tile;
  }
  function renderClients(force) {
    const box = $("clients");
    if (view !== "clients" || !box) return;
    if (!force && deferIfTyping(box, () => renderClients(true))) return;
    box.replaceChildren();
    const canAsk = !!(sampleFn && dbApi && mcp);
    box.append(el("div", { class: "clients-head" },
      el("span", { class: "grow", text: clientsMsg || (clientsCfg && clientsCfg.length ? "Ingedeeld op afzender, deelnemers, bord, kanaal en trefwoorden." : "") }),
      canAsk ? el("button", { class: "btn", type: "button", text: clientsBusy ? "Claude kijkt mee…" : "Klanten bijwerken", disabled: clientsBusy, onclick: updateClients }) : null));
    if (clientsCfg === null) { box.append(el("div", { class: "tile" }, el("div", { class: "skel" }, el("i"), el("i"), el("i")))); return; }
    if (!clientsCfg.length) {
      box.append(el("div", { class: "tile" }, el("p", { class: "empty", text: "Nog geen klanten ingesteld. Klik op ‘Klanten bijwerken’; Claude stelt ze voor op basis van je mail, agenda, Slack en monday." })));
      return;
    }
    const { list, other } = clientBuckets();
    const filled = list.filter((b) => b.meetings.length + b.mails.length + b.tasks.length + b.slack.length)
      .map((b) => ({ b, score: bucketScore(b) })).sort((a, b) => b.score - a.score).map((x) => x.b);
    for (const b of filled) box.append(clientTile(b));
    if (other.meetings.length + other.mails.length + other.tasks.length + other.slack.length) box.append(clientTile(other));
    if (!filled.length && !other.mails.length && !other.tasks.length) box.append(el("div", { class: "tile" }, el("div", { class: "skel" }, el("i"), el("i"), el("i"))));
  }
  function normalizeClients(out) {
    const raw = out && Array.isArray(out.clients) ? out.clients : Array.isArray(out) ? out : [];
    const seen = new Set();
    return raw.filter((c) => c && typeof c === "object").map((c) => ({
      name: clip(String(c.name || ""), 40),
      domains: [...new Set((Array.isArray(c.domains) ? c.domains : []).map((d) => String(d).toLowerCase().trim().replace(/^@/, "")).filter((d) => /^[a-z0-9.-]+\.[a-z]{2,}$/.test(d) && !OWN.has(d)))].slice(0, 12),
      keywords: [...new Set((Array.isArray(c.keywords) ? c.keywords : []).map((k) => clip(String(k), 40)).filter((k) => k.length >= 2))].slice(0, 24),
    })).filter((c) => {
      const k = c.name.toLowerCase();
      if (!c.name || seen.has(k) || !(c.domains.length || c.keywords.length)) return false;
      seen.add(k);
      return true;
    }).slice(0, 30);
  }
  async function updateClients() {
    if (clientsBusy || !sampleFn || !dbApi) return;
    clientsBusy = true; clientsMsg = "Claude bekijkt je mail, agenda, Slack en monday…";
    renderClients(true);
    try {
      const { other } = clientBuckets();
      const boards = [...new Set(Object.values(boardMeta).map((m) => (m.ws ? m.ws + " / " : "") + m.name))].slice(0, 60);
      const unmatched = {
        mails: other.mails.slice(0, 40).map((t) => { const m = (t.messages || [])[0] || {}; return { van: emailOf(m.sender), onderwerp: clip(decode(m.subject), 100) }; }),
        afspraken: other.meetings.slice(0, 30).map((r) => ({ titel: clip(r.ev.summary, 100), domeinen: [...new Set((r.ev.attendees || []).map((a) => domainOf(a.email)).filter((d) => d && !OWN.has(d)))] })),
        taken: other.tasks.slice(0, 40).map((x) => ((boardMeta[x.boardId] || {}).ws || "") + " / " + x.board + " / " + clip(x.item.name, 80)),
        slack: other.slack.slice(0, 20).map((g) => g.where + ": " + clip(g.msgs.map((m) => m.text).join(" "), 120)),
      };
      const prompt = [
        "Je beheert de klantindeling van het dashboard van " + (firstName || "de gebruiker") + " (The Brand Father, een creatief bureau). Hieronder staan de huidige klanten en de items die nog bij geen klant horen.",
        "Geef de volledige, bijgewerkte lijst terug:\n- Behoud bestaande klanten en vul hun domeinen en trefwoorden aan waar dat helpt.\n- Voeg een nieuwe klant of project toe als meerdere items erbij horen.\n- Collega's van thebrandfather.nl zijn geen klant. Interne zaken (weekstart, sales, marketing van TBF) horen bij \"TBF intern\".\n- Domeinen: e-maildomeinen van de klant of van zijn bureau.\n- Trefwoorden: specifieke merk-, project-, bord- of kanaalnamen. Geen algemene woorden zoals design, update of meeting.",
        'Antwoord met alleen JSON: {"clients":[{"name":"...","domains":["..."],"keywords":["..."]}]}',
        "HUIDIGE KLANTEN:\n" + JSON.stringify(clientsCfg || []),
        "BORDEN IN MONDAY:\n" + boards.join("\n"),
        "NOG NIET INGEDEELD:\n" + JSON.stringify(unmatched),
      ].join("\n\n");
      const list = normalizeClients(await sampleFn.json(prompt, { cache: false }));
      if (!list.length) throw { code: "invalid_json" };
      await dbApi.doc("state/clients").set({ clients: list, updatedAt: new Date().toISOString() });
      clientsMsg = "Klanten bijgewerkt: " + list.length + ".";
    } catch (e) {
      clientsMsg = aiProblem(e, "Bijwerken lukte niet. Probeer het opnieuw.");
    } finally {
      clientsBusy = false;
      renderClients(true);
    }
  }

  // ---------- Altijd actueel ----------
  let briefLoaded = false, autoSlot = "";
  const bootAt = Date.now();
  function briefingStale(doc) {
    const now = new Date(), min = minuteOfDay(now);
    if (min < 6 * 60 + 45 || min >= 20 * 60) return false;
    if (!doc || doc.date !== today()) return true;
    if (Array.isArray(doc.issues) && doc.issues.length >= 2) return true;
    const g = new Date(doc.generatedAt);
    return isNaN(g) || now - g > 3 * 3600000;
  }
  function maybeAutoBriefing() {
    if (!briefLoaded || !sampleFn || !dbApi || !mcp || briefBusy || document.hidden) return;
    if (!briefingStale(lastBriefDoc)) return;
    const ready = tasks.data != null && cal.data != null && (slackA.data != null || slackB.data != null);
    if (!ready && Date.now() - bootAt < 90000) return;
    const slot = today() + ":" + Math.floor(Date.now() / (3 * 3600000));
    if (autoSlot === slot || store.get("autoBrief", "") === slot) return;
    autoSlot = slot;
    store.set("autoBrief", slot);
    makeBriefing(true);
  }
  setInterval(maybeAutoBriefing, 30000);

  // ---------- boot ----------
  cal.render(); mail.render(); tasks.render(); drawSlack(true);
  setView(view);
  renderStats();
  $("day-label").textContent = dayLabel(calDay);
  const api = window.claude && typeof window.claude.use === "function" ? window.claude : { use: () => Promise.resolve(null) };

  api.use("db").then((db) => {
    dbApi = db;
    if (!db) {
      try { slackRead = JSON.parse(store.get("slackRead", "{}")) || {}; } catch { slackRead = {}; }
      briefLoaded = true; renderBriefing(null); drawSlack(true);
      clientsCfg = []; renderClients();
      return;
    }
    db.collection("briefings").orderBy("date", "desc").limit(1).onSnapshot(
      (snap) => { briefLoaded = true; renderBriefing(snap.empty ? null : snap.docs[0].data()); setTimeout(maybeAutoBriefing, 0); },
      () => { briefLoaded = true; renderBriefing(null); });
    db.doc("state/clients").onSnapshot((snap) => {
      const d = snap.exists ? snap.data() : null;
      clientsCfg = d && Array.isArray(d.clients) ? d.clients : [];
      clientsCompiled = compileClients(clientsCfg);
      renderClients();
    }, () => { clientsCfg = []; clientsCompiled = []; renderClients(); });
    db.doc("state/slack").onSnapshot((snap) => {
      const d = snap.exists ? snap.data() : null;
      slackRead = Object.assign({}, (d && d.read) || {});
      drawSlack();
    }, () => {});
  }).catch(() => renderBriefing(null));

  api.use("sample").then((fn) => { sampleFn = fn; renderBriefing(lastBriefDoc); }).catch(() => {});

  Promise.all([api.use("mcp"), api.use("permissions")]).then(async ([m, p]) => {
    mcp = m; permissions = p;
    renderBriefing(lastBriefDoc);
    if (!mcp) {
      const off = { code: "not_granted" };
      [cal, mail, tasks].forEach((w) => w.fail(off));
      slackA.err = off; drawSlack(true);
      return;
    }
    // One batched consent dialog instead of four.
    if (permissions) {
      try { await permissions.request(Object.values(SV).map((s) => "mcp:" + s)); } catch { /* fall back to asking per call */ }
    }
    watchCal();
    watchMail();
    unreadCount.watch("search_threads", { query: "in:inbox is:unread", pageSize: 50, view: "THREAD_VIEW_METADATA_ONLY" }, 60000);
    boardsW.watch("all_api_read", { query: "query { me { id name } boards(limit: 200, state: active) { id name type workspace { name } columns(types:[people, status]) { id type title settings_str } } }" }, 3600000);
    watchSlack();
    if (view === "clients") startClientWatches();
  }).catch(() => {
    const off = { code: "capability_disabled" };
    [cal, mail, tasks].forEach((w) => w.fail(off));
  });

  $("refresh-all").addEventListener("click", () => { cal.refresh(); mail.refresh(); unreadCount.refresh(); tasks.refresh(); slack.refresh(); calWeek.refresh(); mailAll.refresh(); });

  // Roll over at midnight so "today" stays right on an open tab.
  let shownDay = today();
  setInterval(() => {
    const t = today();
    if (t === shownDay) return;
    const wasToday = calDay === shownDay;
    shownDay = t; renderMast();
    if (mcp) {
      if (wasToday) { calDay = t; watchCal(); }
      watchSlack();
      if (clientWatching) { clientWatching = false; startClientWatches(); }
    }
  }, 60000);
})();
