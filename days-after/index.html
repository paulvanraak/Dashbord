<style>
/* Layout: a single phone-width lab column — header, scrolling content, fixed action bar and tab bar. Graph-paper grid only on the splash. */
:root {
  --bg: #F4F7FB;
  --surface: #FFFFFF;
  --ink: #0C1A2E;
  --muted: #56667E;
  --line: #DCE4EE;
  --blue: #1D55D8;
  --blue-ink: #FFFFFF;
  --blue-soft: #E7EEFC;
  --grid: rgba(29, 85, 216, .07);
  --shadow: 0 1px 2px rgba(12, 26, 46, .05), 0 6px 24px rgba(12, 26, 46, .06);
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --col: 480px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #08111F; --surface: #0F1A2C; --ink: #E5ECF7; --muted: #8E9DB4; --line: #1F2E47;
    --blue: #6E9CFF; --blue-ink: #06101F; --blue-soft: #14254A; --grid: rgba(110, 156, 255, .08);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #08111F; --surface: #0F1A2C; --ink: #E5ECF7; --muted: #8E9DB4; --line: #1F2E47;
  --blue: #6E9CFF; --blue-ink: #06101F; --blue-soft: #14254A; --grid: rgba(110, 156, 255, .08);
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.25);
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 6px; }

.ic { width: 22px; height: 22px; fill: none; stroke: var(--blue); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic.sm { width: 18px; height: 18px; }
.ic.lg { width: 28px; height: 28px; }

.app { max-width: var(--col); margin: 0 auto; min-height: 100%; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(150px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 520px) { .app { border-left: 1px solid var(--line); border-right: 1px solid var(--line); } }

/* Header */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; align-items: center; gap: 10px; padding-block: 14px 12px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.top .brand { font-weight: 500; letter-spacing: -.01em; font-size: 16px; }
.top .brand b { font-weight: 300; color: var(--blue); }
.top .spacer { flex: 1; }
.iconbtn { display: inline-grid; place-items: center; width: 38px; height: 38px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; }
.iconbtn:hover { border-color: var(--blue); }

h1 { font-size: 26px; font-weight: 500; letter-spacing: -.02em; line-height: 1.15; margin: 0 0 6px; text-wrap: balance; }
h2 { font-size: 13px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 28px 0 10px; font-family: var(--mono); }
p { margin: 0; }
.lead { color: var(--muted); max-width: 60ch; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.label { font-family: var(--mono); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

/* Search + filters */
.search { position: relative; margin-top: 16px; }
.search .ic { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); }
.search input { width: 100%; height: 48px; padding: 0 14px 0 44px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; outline: none; }
.search input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 12px 0 4px; margin: 0 -2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: var(--blue-ink); }

/* Substance list */
.list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); overflow: hidden; margin-top: 10px; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; width: 100%; }
.row:first-child { border-top: 0; }
.row:hover { background: var(--blue-soft); }
.row .glyph { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; background: var(--blue-soft); flex: none; }
.row .txt { flex: 1; min-width: 0; }
.row .name { font-weight: 500; }
.row .aka { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .meta { font-family: var(--mono); font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.switch { position: relative; width: 44px; height: 26px; border-radius: 999px; background: var(--line); flex: none; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .2s; }
.row[aria-checked="true"] .switch { background: var(--blue); }
.row[aria-checked="true"] .switch::after { transform: translateX(18px); }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }

/* Fixed action bar + tab bar */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; pointer-events: none; }
.dock > * { pointer-events: auto; }
.dock-inner { max-width: var(--col); margin: 0 auto; }
.cta-wrap { padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); background: linear-gradient(to top, var(--bg) 70%, transparent); }
.cta { width: 100%; height: 54px; border: 0; border-radius: 14px; background: var(--blue); color: var(--blue-ink); font-weight: 500; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 10px; }
.cta .ic { stroke: var(--blue-ink); }
.cta:disabled { opacity: .45; cursor: not-allowed; }
.cta .count { font-family: var(--mono); font-size: 12.5px; padding: 2px 8px; border-radius: 999px; background: rgba(255,255,255,.18); }
.btn2 { height: 46px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 500; display: inline-flex; align-items: center; gap: 8px; justify-content: center; }
.btn2:hover { border-color: var(--blue); }
.btn2.primary { background: var(--blue); border-color: var(--blue); color: var(--blue-ink); }
.btn2.primary .ic { stroke: var(--blue-ink); }
.tabs { display: flex; background: var(--surface); border-top: 1px solid var(--line); padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
@media (min-width: 520px) { .tabs { border-left: 1px solid var(--line); border-right: 1px solid var(--line); } }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; border: 0; background: none; font-size: 12px; color: var(--muted); position: relative; }
.tab[aria-current="page"] { color: var(--ink); font-weight: 500; }
.tab[aria-current="page"]::before { content: ""; position: absolute; top: -7px; width: 28px; height: 2px; border-radius: 2px; background: var(--blue); }
.tab .badge { position: absolute; top: 2px; left: calc(50% + 8px); font-family: var(--mono); font-size: 10px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--blue); color: var(--blue-ink); display: grid; place-items: center; }

/* Plan */
.planhead { display: flex; flex-direction: column; gap: 10px; }
.facts { display: flex; flex-wrap: wrap; gap: 6px; }
.fact { font-family: var(--mono); font-size: 12px; padding: 4px 9px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); }
.fact b { color: var(--ink); font-weight: 500; }
.story { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.stories { display: flex; flex-direction: column; gap: 10px; }
.story .head { display: flex; align-items: center; gap: 10px; }
.story .head .name { font-weight: 500; }
.story .head .meta { margin-left: auto; font-family: var(--mono); font-size: 11.5px; color: var(--muted); text-align: right; }
.story p { color: var(--ink); max-width: 62ch; }
.story details { border-top: 1px dashed var(--line); padding-top: 8px; font-size: 13.5px; color: var(--muted); }
.story summary { cursor: pointer; color: var(--blue); font-weight: 500; list-style: none; display: flex; align-items: center; gap: 6px; }
.story summary::-webkit-details-marker { display: none; }
.story details p { margin-top: 6px; color: var(--muted); }
.caution { border: 1px dashed var(--blue); background: var(--blue-soft); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
.caution .c { display: flex; gap: 10px; align-items: flex-start; }
.caution .c b { font-weight: 600; display: block; }
.caution .c span { color: var(--ink); font-size: 14px; }

.daybar { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.daybar::-webkit-scrollbar { display: none; }
.daybtn { flex: 1 0 64px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 6px; display: flex; flex-direction: column; align-items: center; gap: 0; }
.daybtn .n { font-weight: 500; }
.daybtn .d { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.daybtn[aria-selected="true"] { background: var(--blue); border-color: var(--blue); color: var(--blue-ink); }
.daybtn[aria-selected="true"] .d { color: var(--blue-ink); opacity: .8; }
.dayhead { margin: 18px 0 4px; display: flex; flex-direction: column; gap: 4px; }
.dayhead .t { font-size: 20px; font-weight: 500; letter-spacing: -.01em; }
.note { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); margin-top: 10px; font-size: 14px; }
.sect { margin-top: 18px; }
.sect .sh { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.sect .sh .label { color: var(--ink); font-size: 12px; }
.items { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); overflow: hidden; }
.item { padding: 12px 14px; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.item .it { font-weight: 500; }
.item .why { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
.item .why span { display: block; }
.actions { display: flex; gap: 8px; margin-top: 24px; flex-wrap: wrap; }
.actions > * { flex: 1 1 140px; }
.disclaimer { margin-top: 22px; font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; max-width: 62ch; }

/* Saved */
.saved { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
.scard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: flex; gap: 12px; align-items: center; }
.scard .txt { flex: 1; min-width: 0; }
.scard .t { font-weight: 500; }
.scard .s { color: var(--muted); font-size: 13px; }
.scard .open { border: 0; background: none; text-align: left; padding: 0; width: 100%; }
.confirm { display: flex; gap: 6px; }
.confirm button { height: 34px; padding: 0 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; }
.confirm .yes { border-color: var(--blue); color: var(--blue); }
.emptystate { text-align: center; padding: 40px 16px; border: 1px dashed var(--line); border-radius: 14px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 16px; }

/* Forms */
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field .box { display: flex; align-items: center; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; height: 50px; padding: 0 12px; }
.field .box:focus-within { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
.field input { border: 0; outline: none; background: none; width: 100%; min-width: 0; font-family: var(--mono); font-size: 16px; }
.field .unit { font-family: var(--mono); color: var(--muted); font-size: 13px; }
.points { display: flex; flex-direction: column; gap: 14px; margin-top: 22px; }
.point { display: flex; gap: 12px; align-items: flex-start; }
.point .glyph { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; background: var(--blue-soft); flex: none; }
.point b { font-weight: 500; display: block; }
.point span { color: var(--muted); font-size: 14px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
.kv { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
.kv .v { font-family: var(--mono); }

.toast { position: fixed; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(10px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .2s, transform .2s; z-index: 30; pointer-events: none; }
.toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Splash */
.splash { position: fixed; inset: 0; z-index: 50; background-color: var(--bg); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 24px 24px; background-position: center; display: grid; place-items: center; transition: opacity .5s ease; cursor: pointer; }
.splash.out { opacity: 0; pointer-events: none; }
.splash .mark { display: flex; flex-direction: column; align-items: center; gap: 18px; }
.splash svg.logo { width: 112px; height: 112px; fill: none; stroke: var(--blue); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.splash .word { font-size: 38px; font-weight: 300; letter-spacing: -.02em; }
.splash .word b { font-weight: 500; }
.splash .sub { font-family: var(--mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.logo .sun { stroke-dasharray: 60; stroke-dashoffset: 0; animation: draw 1.2s ease-out both; }
.logo .ray { animation: fade .6s ease-out .7s both; }
.logo .tick { animation: fade .6s ease-out .3s both; }
@keyframes draw { from { stroke-dashoffset: 60; } to { stroke-dashoffset: 0; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .logo .sun, .logo .ray, .logo .tick { animation: none; } .splash, .switch, .switch::after { transition: none; } }
</style>

<div class="splash" id="splash" role="button" aria-label="Open Days After" tabindex="0">
  <div class="mark">
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
      <path class="sun" d="M18 40a14 14 0 0 1 28 0"/>
      <path class="ray" d="M32 18v-6M17.2 25.2l-4.2-4.2M46.8 25.2l4.2-4.2M10 40H4M60 40h-6"/>
      <path d="M4 40h56"/>
      <path class="tick" d="M12 46v3M22 46v3M32 46v5M42 46v3M52 46v3"/>
    </svg>
    <div class="word">Days <b>After</b></div>
    <div class="sub">Recovery, day by day</div>
  </div>
</div>

<div class="app" id="app"></div>
<div class="dock"><div class="dock-inner" id="dock"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
"use strict";

/* ---------- Icons (line, blue) ---------- */
const ICON = {
  logo: '<path d="M7 16a5 5 0 0 1 10 0"/><path d="M12 8V6M6.7 10.7 5.3 9.3M17.3 10.7l1.4-1.4"/><path d="M3 16h18M7 19h10"/>',

  alert: '<path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17v.5"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.5"/>',
  trash: '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
  shield: '<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/>',

  psychedelic: '<path d="M2.5 12S6 6 12 6s9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"/><circle cx="12" cy="12" r="3"/>',

const ic = (n, cls) => '<svg class="ic ' + (cls || '') + '" viewBox="0 0 24 24" aria-hidden="true">' + ICON[n] + '</svg>';

/* ---------- Categories ---------- */
const CATS = [
  ["stimulant", "Stimulant"], ["empathogen", "Empathogen"], ["psychedelic", "Psychedelic"],
  ["dissociative", "Dissociative"], ["depressant", "Depressant"], ["cannabinoid", "Cannabinoid"],
  ["inhalant", "Inhalant"], ["plant", "Plant-based"]
];
const CATNAME = Object.fromEntries(CATS);

/* ---------- 30 substances ---------- */
const SUBS = [
  { id: "alcohol", n: "Alcohol", aka: "beer, wine, spirits", c: "depressant", dur: "Clears ≈ 1 unit / h", days: 2,
    tags: ["hydration", "electrolytes", "liver", "sleep", "mood", "bloodsugar", "gut", "oxidative"],
    story: "Alcohol slowed signalling in your brain by boosting GABA and dampening glutamate, which is why everything felt loose and easy. Your liver broke it down at roughly one unit per hour, producing acetaldehyde, a toxic by-product behind much of the headache and nausea. Alcohol also blocked the hormone that holds on to water, so you lost more fluid than you drank. Your sleep may have felt long, but it skipped much of the deep, restoring phase.",

const SECTIONS = [["vit", "Vitamins & supplements", "vit"], ["drink", "Drinks", "drink"], ["eat", "Eat", "eat"], ["avoid", "Avoid", "avoid"]];
const PER_SECTION = 4;

/* ---------- Plan generator ---------- */
function buildPlan(ids, profile, createdISO) {
  const subs = ids.map(id => BYID[id]).filter(Boolean);
  const set = new Set(subs.map(s => s.id));
  const tags = {};
  subs.forEach(s => s.tags.forEach(t => { tags[t] = (tags[t] || 0) + 1; }));
  const len = Math.min(5, Math.max(2, ...subs.map(s => s.days)));
  const w = profile.w, h = profile.h;
  const ctx = {
    tags, has: id => set.has(id),
    water(d) {
      const extra = (tags.hydration || tags.electrolytes) ? (d === 1 ? 0.5 : d === 2 ? 0.25 : 0) : 0;
      if (!w) return (d === 1 && extra ? "2.5–3 L" : "2–2.5 L") + " (add your weight for a personal target)";
      const L = Math.min(4.5, Math.max(1.5, w * 0.035 + extra));
      return L.toFixed(1).replace(".0", "") + " L";
    },
    protein: w ? "≈ " + Math.round(w * 1.2 / 5) * 5 + " g today" : "≈ 1.2 g per kg of body weight",
    kcal: (w && h) ? Math.round(((10 * w + 6.25 * h - 150 - 78) * 1.4) / 50) * 50 : null
  };
  const start = new Date(createdISO);
  const days = [];
  for (let d = 1; d <= len; d++) {
    const date = new Date(start); date.setDate(start.getDate() + d - 1);
    const sections = {};
    SECTIONS.forEach(([k]) => {
      sections[k] = ADVICE
        .filter(a => a.k === k && d >= a.d[0] && d <= a.d[1])
        .filter(a => a.always || a.tags.some(t => tags[t]))
        .filter(a => !a.when || a.when(ctx))
        .map(a => ({ a, score: (a.p || 0) * 10 + (a.always ? 0 : a.tags.reduce((n, t) => n + (tags[t] || 0), 0)) }))
        .sort((x, y) => y.score - x.score)
        .slice(0, PER_SECTION)
        .map(({ a }) => ({ t: typeof a.t === "function" ? a.t(ctx, d) : a.t, w: a.w }));
    });
    days.push({ n: d, date, title: dayTitle(d, len, tags), note: dayNote(d, len, tags, set), sections });
  }
  return { subs, set, len, days, ctx, combos: COMBOS.filter(c => c.test(set)) };
}

function dayTitle(d, len, t) {
  if (d === 1) return t.maoi ? "Settle and stay careful" : (t.hydration || t.electrolytes) ? "Rehydrate and stabilise" : t.integration ? "Rest and land" : "Rest and recover";
  if (d === 2) return t.appetite || t.gut ? "Refuel gently" : "Refuel and rest";
  if (d === len) return "Back to your rhythm";
  if ((t.serotonin || t.dopamine) && (d === 3 || d === 4)) return "Rebuild your chemistry";
  return t.integration ? "Integrate and rebalance" : "Rebalance";
}

function dayNote(d, len, t, set) {
  if (d === 1 && t.maoi) return "For the next 24 hours, eat fresh food only and take no new medicines without checking with a doctor.";
  if (d === 1 && t.depressant) return "Rest somewhere safe and let someone know how you're doing. Don't drive today.";
  if (d === 1 && t.integration) return "Write down what you remember before it fades. Even three lines help you integrate later.";
  if (d === 1) return "Rest is the main treatment today. Sleep when you can and eat small portions often.";
  if (t.b12 && d === 2) return "Keep taking B12 all week, even if you feel fine. Nerve damage can show up late.";
  if (t.serotonin && (d === 3 || d === 4)) return "This is when the midweek dip usually arrives. Low mood now is chemistry, and it passes.";
  if (t.dopamine && d === 2) return "Cravings and flat motivation are normal now. Plan one small, pleasant thing for today.";
  if (t.integration && d <= 3) return "Spend time in nature and talk with someone you trust about what came up.";
  if (t.bladder) return "If peeing still hurts after a few days, see a doctor and mention ketamine.";
  if (d === len) return "Notice how you feel compared to day 1. Give yourself some time before the next session.";
  return "A short walk in daylight helps reset your sleep and mood.";
}

const KEY = "daysafter.v1";
function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
function persist() { try { localStorage.setItem(KEY, JSON.stringify({ onboarded: S.onboarded, profile: S.profile, saved: S.saved })); } catch (e) {} }

const stored = load();
const S = {
  onboarded: !!stored.onboarded,
  profile: stored.profile || { w: null, h: null },
  saved: Array.isArray(stored.saved) ? stored.saved : [],
  view: stored.onboarded ? "subs" : "onboard",
  selected: new Set(), q: "", cat: "all",
  plan: null, planMeta: null, day: 1, confirmDel: null
};

const fmtDay = d => d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
const fmtShort = d => d.toLocaleDateString("en-GB", { day: "numeric", month: "short" });
const app = document.getElementById("app"), dock = document.getElementById("dock");
let toastT;

}

function openPlan(ids, meta) {
  S.planMeta = meta;
  S.plan = buildPlan(ids, { w: meta.w, h: meta.h }, meta.created);
  S.day = 1; S.view = "plan"; render();
}

/* ---------- Events ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (act === "toggle") {
    const id = b.dataset.id;
    S.selected.has(id) ? S.selected.delete(id) : S.selected.add(id);
    b.setAttribute("aria-checked", S.selected.has(id));
    renderDock();
  } else if (act === "cat") { S.cat = b.dataset.cat; render(true); }
  else if (act === "start") { readBody(); S.onboarded = true; persist(); S.view = "subs"; render(); }
  else if (act === "skip") { S.onboarded = true; persist(); S.view = "subs"; render(); }
  else if (act === "create") {
    openPlan([...S.selected], { id: null, created: new Date().toISOString(), w: S.profile.w, h: S.profile.h, subs: [...S.selected] });
  } else if (act === "day") { S.day = +b.dataset.day; render(true); }
  else if (act === "back") { S.view = S.planMeta && S.planMeta.id ? "saved" : "subs"; render(); }
  else if (act === "save") {
    const m = S.planMeta; m.id = "p" + Date.now().toString(36);
    S.saved.push({ id: m.id, created: m.created, subs: m.subs, w: m.w, h: m.h });
    persist(); renderDock(); render(true); toast("Plan saved on this device");
  } else if (act === "nav") { S.confirmDel = null; S.view = b.dataset.view; render(); }
  else if (act === "open") {
    const s = S.saved.find(x => x.id === b.dataset.id);
    if (s) openPlan(s.subs, { ...s });
  } else if (act === "askdel") { S.confirmDel = b.dataset.id; render(true); }
  else if (act === "nodel") { S.confirmDel = null; render(true); }
  else if (act === "yesdel") { S.saved = S.saved.filter(x => x.id !== b.dataset.id); S.confirmDel = null; persist(); render(true); toast("Plan deleted"); }
  else if (act === "savebody") { readBody(); render(true); toast("Saved"); }
  else if (act === "askwipe") { S.confirmDel = "all"; render(true); }
  else if (act === "wipe") {
    S.saved = []; S.profile = { w: null, h: null }; S.confirmDel = null;
    try { localStorage.removeItem(KEY); } catch (err) {}
    S.onboarded = true; persist(); render(true); toast("All data cleared");
  }
});

document.addEventListener("input", e => {
  if (e.target.id !== "q") return;
  S.q = e.target.value;
  const pos = e.target.selectionStart;
  render(true);
  const q = document.getElementById("q"); q.focus(); try { q.setSelectionRange(pos, pos); } catch (err) {}
});

/* ---------- Splash ---------- */
const splash = document.getElementById("splash");
function hideSplash() { if (splash.classList.contains("out")) return; splash.classList.add("out"); setTimeout(() => { splash.hidden = true; }, 520); }
splash.addEventListener("click", hideSplash);
splash.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") hideSplash(); });
setTimeout(hideSplash, 2200);

render();
})();
</script>
