<title>Days After</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap">
<style>
/* Layout: a single phone-width lab column — header, scrolling content, fixed action bar and tab bar, bottom sheets. Graph-paper grid only on the splash. */
:root {
  --bg: #F4F7FB;
  --surface: #FFFFFF;
  --ink: #0C1A2E;
  --muted: #56667E;
  --line: #DCE4EE;
  --blue: #1D55D8;
  --blue-ink: #FFFFFF;
  --blue-soft: #E7EEFC;
  --tint: #C9D8FA;
  --grid: rgba(29, 85, 216, .07);
  --scrim: rgba(12, 26, 46, .38);
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --col: 480px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #08111F; --surface: #0F1A2C; --ink: #E5ECF7; --muted: #8E9DB4; --line: #1F2E47;
    --blue: #6E9CFF; --blue-ink: #06101F; --blue-soft: #14254A; --tint: #24427E; --grid: rgba(110, 156, 255, .08); --scrim: rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #08111F; --surface: #0F1A2C; --ink: #E5ECF7; --muted: #8E9DB4; --line: #1F2E47;
  --blue: #6E9CFF; --blue-ink: #06101F; --blue-soft: #14254A; --tint: #24427E; --grid: rgba(110, 156, 255, .08); --scrim: rgba(0, 0, 0, .55);
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 6px; }

.ic { width: 22px; height: 22px; fill: none; stroke: var(--blue); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic.sm { width: 18px; height: 18px; }
.ic.lg { width: 28px; height: 28px; }

.app { max-width: var(--col); margin: 0 auto; min-height: 100%; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(150px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 520px) { .app { border-left: 1px solid var(--line); border-right: 1px solid var(--line); } }

/* Header */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; align-items: center; gap: 10px; padding-block: 14px 12px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.top .brand { font-weight: 500; letter-spacing: -.01em; font-size: 16px; }
.top .brand b { font-weight: 300; color: var(--blue); }
.top .spacer { flex: 1; }
.iconbtn { display: inline-grid; place-items: center; width: 38px; height: 38px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; flex: none; }
.iconbtn:hover { border-color: var(--blue); }

h1 { font-size: 26px; font-weight: 500; letter-spacing: -.02em; line-height: 1.15; margin: 0 0 6px; text-wrap: balance; }
h2 { font-size: 13px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 28px 0 10px; font-family: var(--mono); }
p { margin: 0; }
.lead { color: var(--muted); max-width: 60ch; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.label { font-family: var(--mono); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

/* Search + filters */
.search { position: relative; margin-top: 16px; }
.search .ic { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); }
.search input { width: 100%; height: 48px; padding: 0 14px 0 44px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; outline: none; }
.search input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 12px 0 4px; margin: 0 -2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: var(--blue-ink); }

/* Substance list */
.list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); overflow: hidden; margin-top: 10px; }
.sub { border-top: 1px solid var(--line); }
.sub:first-child { border-top: 0; }
.sub.on { background: var(--blue-soft); }
.row { display: flex; align-items: center; gap: 6px; padding: 0 14px 0 0; }
.rowmain { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 12px 0 12px 14px; border: 0; background: none; text-align: left; }
.glyph { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; background: var(--blue-soft); flex: none; }
.sub.on .glyph { background: var(--surface); }
.rowmain .txt { flex: 1; min-width: 0; }
.rowmain .name { font-weight: 500; }
.rowmain .aka { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rowmain .meta { font-family: var(--mono); font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.qbtn { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: none; font-family: var(--mono); font-weight: 500; font-size: 14px; color: var(--blue); }
.qbtn:hover { border-color: var(--blue); }
.swbtn { border: 0; background: none; padding: 8px 0 8px 4px; flex: none; }
.switch { display: block; position: relative; width: 44px; height: 26px; border-radius: 999px; background: var(--line); transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .2s; }
.sub.on .switch { background: var(--blue); }
.sub.on .switch::after { transform: translateX(18px); }
.amount { display: flex; flex-direction: column; gap: 6px; padding: 0 14px 14px 66px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: none; border-radius: 7px; padding: 6px 4px; font-size: 13px; display: flex; flex-direction: column; align-items: center; line-height: 1.25; }
.seg button small { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--blue); color: var(--blue-ink); font-weight: 500; }
.seg button[aria-pressed="true"] small { color: var(--blue-ink); opacity: .8; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }

/* Fixed action bar + tab bar */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; pointer-events: none; }
.dock > * { pointer-events: auto; }
.dock-inner { max-width: var(--col); margin: 0 auto; }
.cta-wrap { display: flex; gap: 8px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); background: linear-gradient(to top, var(--bg) 70%, transparent); }
.cta { flex: 1; height: 54px; border: 0; border-radius: 14px; background: var(--blue); color: var(--blue-ink); font-weight: 500; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 10px; }
.cta .ic { stroke: var(--blue-ink); }
.cta:disabled { opacity: .45; cursor: not-allowed; }
.cta.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.cta.ghost .ic { stroke: var(--blue); }
.cta .count { font-family: var(--mono); font-size: 12.5px; padding: 2px 8px; border-radius: 999px; background: rgba(255,255,255,.18); }
.btn2 { height: 46px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 500; display: inline-flex; align-items: center; gap: 8px; justify-content: center; text-decoration: none; }
.btn2:hover { border-color: var(--blue); }
.btn2.primary { background: var(--blue); border-color: var(--blue); color: var(--blue-ink); }
.btn2.primary .ic { stroke: var(--blue-ink); }
.tabs { display: flex; background: var(--surface); border-top: 1px solid var(--line); padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
@media (min-width: 520px) { .tabs { border-left: 1px solid var(--line); border-right: 1px solid var(--line); } }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; border: 0; background: none; font-size: 12px; color: var(--muted); position: relative; }
.tab[aria-current="page"] { color: var(--ink); font-weight: 500; }
.tab[aria-current="page"]::before { content: ""; position: absolute; top: -7px; width: 28px; height: 2px; border-radius: 2px; background: var(--blue); }
.tab .badge { position: absolute; top: 2px; left: calc(50% + 8px); font-family: var(--mono); font-size: 10px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--blue); color: var(--blue-ink); display: grid; place-items: center; }

/* Plan */
.planhead { display: flex; flex-direction: column; gap: 10px; }
.facts { display: flex; flex-wrap: wrap; gap: 6px; }
.fact { font-family: var(--mono); font-size: 12px; padding: 4px 9px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); }
.fact b { color: var(--ink); font-weight: 500; }
.stories { display: flex; flex-direction: column; gap: 10px; }
.story { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.story .head { display: flex; align-items: center; gap: 10px; }
.story .head .txt { flex: 1; min-width: 0; }
.story .head .name { font-weight: 500; }
.story .head .meta { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.story p { max-width: 62ch; }
.story .help { border: 0; background: none; padding: 0; color: var(--blue); font-weight: 500; font-size: 13.5px; display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; }
.caution { border: 1px dashed var(--blue); background: var(--blue-soft); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
.caution .c { display: flex; gap: 10px; align-items: flex-start; }
.caution .c b { font-weight: 600; display: block; }
.caution .c span { font-size: 14px; }

.daybar { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.daybar::-webkit-scrollbar { display: none; }
.daybtn { flex: 1 0 64px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 6px; display: flex; flex-direction: column; align-items: center; }
.daybtn .n { font-weight: 500; }
.daybtn .d { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.daybtn[aria-selected="true"] { background: var(--blue); border-color: var(--blue); color: var(--blue-ink); }
.daybtn[aria-selected="true"] .d { color: var(--blue-ink); opacity: .8; }
.dayhead { margin: 18px 0 4px; display: flex; flex-direction: column; gap: 4px; }
.dayhead .t { font-size: 20px; font-weight: 500; letter-spacing: -.01em; }
.note { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); margin-top: 10px; font-size: 14px; }
.sect { margin-top: 18px; }
.sect .sh { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.sect .sh .label { color: var(--ink); font-size: 12px; }
.items { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); overflow: hidden; }
.item { padding: 11px 14px; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.item .it { font-weight: 500; }
.item .why { color: var(--muted); font-size: 13.5px; }
.item .why span { display: block; }
.disclaimer { margin-top: 22px; font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; max-width: 62ch; }
.actions { display: flex; gap: 8px; margin-top: 24px; flex-wrap: wrap; }
.actions > * { flex: 1 1 140px; }

/* Saved */
.saved { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
.scard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: flex; gap: 12px; align-items: center; }
.scard .txt { flex: 1; min-width: 0; }
.scard .t { font-weight: 500; }
.scard .s { color: var(--muted); font-size: 13px; }
.scard .open { border: 0; background: none; text-align: left; padding: 0; width: 100%; }
.confirm { display: flex; gap: 6px; }
.confirm button { height: 34px; padding: 0 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; }
.confirm .yes { border-color: var(--blue); color: var(--blue); }
.emptystate { text-align: center; padding: 40px 16px; border: 1px dashed var(--line); border-radius: 14px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 16px; }

/* Forms */
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field .box { display: flex; align-items: center; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; height: 50px; padding: 0 12px; }
.field .box:focus-within { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
.field input { border: 0; outline: none; background: none; width: 100%; min-width: 0; font-family: var(--mono); font-size: 16px; }
.field .unit { font-family: var(--mono); color: var(--muted); font-size: 13px; }
.points { display: flex; flex-direction: column; gap: 14px; margin-top: 22px; }
.point { display: flex; gap: 12px; align-items: flex-start; }
.point b { font-weight: 500; display: block; }
.point span { color: var(--muted); font-size: 14px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
.kv { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 14px; }
.kv .v { font-family: var(--mono); }

/* Bottom sheet */
.scrim { position: fixed; inset: 0; z-index: 40; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s ease-out; }
.sheet { width: 100%; max-width: var(--col); max-height: 88vh; overflow-y: auto; background: var(--bg); border-radius: 20px 20px 0 0; padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); animation: rise .25s ease-out; }
.sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 4px auto 12px; }
.sheet .shead { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.sheet .shead .txt { flex: 1; min-width: 0; }
.sheet .shead .t { font-size: 20px; font-weight: 500; letter-spacing: -.01em; line-height: 1.2; }
.sheet .shead .s { color: var(--muted); font-size: 13px; }
.facts.sheetfacts { margin: 6px 0 4px; }
.block { margin-top: 16px; }
.block .label { display: block; margin-bottom: 4px; }
.block ul { margin: 4px 0 0; padding-left: 18px; }
.block li { margin: 2px 0; }
.block li::marker { color: var(--blue); }
.calrows { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); overflow: hidden; margin-top: 14px; }
.calrow { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.calrow:first-child { border-top: 0; }
.calrow .txt { flex: 1 1 140px; min-width: 0; }
.calrow .t { font-weight: 500; }
.calrow .s { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.calrow .links { display: flex; gap: 6px; }
.calrow .links a, .calrow .links button { height: 34px; padding: 0 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
.calrow .links a:hover, .calrow .links button:hover { border-color: var(--blue); }
.preview { margin-top: 14px; padding: 12px 14px; border-radius: 12px; border: 1px dashed var(--line); font-family: var(--mono); font-size: 12px; white-space: pre-wrap; color: var(--muted); overflow-wrap: anywhere; }
.themebtn { width: 34px; height: 34px; border: 0; background: none; display: grid; place-items: center; border-radius: 50%; opacity: .6; }
.themebtn:hover { opacity: 1; background: var(--blue-soft); }
.story { gap: 12px; }
.story .para { display: flex; flex-direction: column; gap: 8px; }
.story .para + .para { border-top: 1px solid var(--line); padding-top: 12px; }
.story .para b, .prose b { font-weight: 600; }
.prose { font-size: 17px; line-height: 1.6; }
.amtag { font-family: var(--mono); font-size: 11.5px; color: var(--muted); margin-left: 4px; white-space: nowrap; }
.qbtn.inline { display: inline-grid; width: 22px; height: 22px; font-size: 12px; vertical-align: 1px; margin-left: 6px; }
.qbtn[aria-expanded="true"] { background: var(--blue); color: var(--blue-ink); border-color: var(--blue); }
.more { background: var(--blue-soft); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; display: flex; flex-direction: column; gap: 4px; }
.more .label { margin-right: 6px; }
.calmain { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
.calmain .cta, .calmain .btn2 { width: 100%; flex: none; text-decoration: none; }
.perday { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 16px; }
.perday a { height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; display: inline-flex; align-items: center; text-decoration: none; }
.perday a:hover { border-color: var(--blue); }
.water { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.ringwrap { position: relative; width: 60px; height: 60px; flex: none; }
.ring { width: 60px; height: 60px; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 6; }
.ring .track { stroke: var(--blue-soft); }
.ring .fill { stroke: var(--blue); stroke-linecap: round; transition: stroke-dashoffset .3s; }
.rin { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12px; font-weight: 500; }
.wtxt { flex: 1; min-width: 0; }
.wn { font-size: 14px; color: var(--muted); }
.wn b { color: var(--ink); font-weight: 500; font-size: 20px; }
.ws { font-size: 11.5px; color: var(--muted); }
.wplus { width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--blue); display: grid; place-items: center; flex: none; }
.wplus .ic { stroke: var(--blue-ink); }
.wplus:disabled { opacity: .4; cursor: default; }
.iconbtn:disabled { opacity: .4; cursor: default; }
.item.recipe { display: block; width: 100%; text-align: left; border: 0; border-top: 1px solid var(--line); background: none; }
.item.recipe:first-child { border-top: 0; }
.ing { margin: 6px 0 4px; padding-left: 18px; font-size: 13.5px; }
.ing li::marker { color: var(--blue); }
.calrow.rem .txt { flex: 1 1 60px; }
.time { font-family: var(--mono); font-size: 14px; border: 1px solid var(--line); background: var(--bg); border-radius: 9px; height: 34px; padding: 0 8px; }
.item.withicon { display: flex; gap: 12px; align-items: flex-start; }
.item .itxt { flex: 1; min-width: 0; }
.duo { width: 38px; height: 38px; border-radius: 10px; background: var(--bg); display: grid; place-items: center; flex: none; }
.duo svg { width: 24px; height: 24px; fill: none; stroke: var(--blue); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.duo svg .f { fill: var(--tint); stroke: none; }
@keyframes rise { from { transform: translateY(30px); opacity: .4; } to { transform: none; opacity: 1; } }

.toast { position: fixed; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(10px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .2s, transform .2s; z-index: 60; pointer-events: none; }
.toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Splash */
.splash { position: fixed; inset: 0; z-index: 50; background-color: var(--bg); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 24px 24px; background-position: center; display: grid; place-items: center; transition: opacity .5s ease; cursor: pointer; }
.splash.out { opacity: 0; pointer-events: none; }
.splash .mark { display: flex; flex-direction: column; align-items: center; gap: 18px; }
.splash svg.logo { width: 112px; height: 112px; fill: none; stroke: var(--blue); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.splash .word { font-size: 38px; font-weight: 300; letter-spacing: -.02em; }
.splash .word b { font-weight: 500; }
.splash .sub { font-family: var(--mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.logo .sun { stroke-dasharray: 60; stroke-dashoffset: 0; animation: draw 1.2s ease-out both; }
.logo .ray { animation: fade .6s ease-out .7s both; }
.logo .tick { animation: fade .6s ease-out .3s both; }
@keyframes draw { from { stroke-dashoffset: 60; } to { stroke-dashoffset: 0; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .logo .sun, .logo .ray, .logo .tick, .scrim, .sheet { animation: none; } .splash, .switch, .switch::after { transition: none; } }

const SECTIONS = [["vit", "Vitamins & supplements", "vit", "Take"], ["drink", "Drinks", "drink", "Drink"], ["eat", "Eat", "eat", "Eat"], ["avoid", "Avoid", "avoid", "Avoid"]];
const PER_SECTION = 4;

/* ---------- Plan generator ---------- */
const subLen = (s, amt) => Math.min(5, Math.max(1, s.days + (amt - 2)));

function buildPlan(picks, profile, createdISO) {
  const list = picks.map(p => ({ s: BYID[p.id], amt: p.amt || 2 })).filter(x => x.s);
  const set = new Set(list.map(x => x.s.id));
  const len = Math.min(5, Math.max(2, ...list.map(x => subLen(x.s, x.amt))));
  const lots = list.filter(x => x.amt === 3);
  const allTags = {};
  list.forEach(x => x.s.tags.forEach(t => { allTags[t] = (allTags[t] || 0) + x.amt; }));
  const w = profile.w, h = profile.h;
  const ctx = {
    tags: allTags, has: id => set.has(id),
    waterL(d) {
      const dry = allTags.hydration || allTags.electrolytes;
      const extra = dry ? (d === 1 ? 0.5 : d === 2 ? 0.25 : 0) + (lots.length && d <= 2 ? 0.25 : 0) : 0;
      if (!w) return 2.25 + extra;
      return Math.round(Math.min(4.5, Math.max(1.5, w * 0.035 + extra)) * 4) / 4;
    },
    water(d) {
      if (!w) return this.waterL(d) > 2.5 ? "2.5–3 L" : "2–2.5 L";
      return this.waterL(d) + " L";
    },
    protein: w ? "≈ " + Math.round(w * 1.2 / 5) * 5 + " g" : "1.2 g / kg",
    kcal: (w && h) ? Math.round(((10 * w + 6.25 * h - 150 - 78) * 1.4) / 50) * 50 : null
  };
  const start = new Date(createdISO);
  const days = [];
  for (let d = 1; d <= len; d++) {
    // a substance only shapes the days it still affects
    const tags = {};
    list.forEach(x => { if (subLen(x.s, x.amt) >= d) x.s.tags.forEach(t => { tags[t] = (tags[t] || 0) + x.amt; }); });
    const dctx = Object.assign({}, ctx, { tags: Object.assign({}, tags, { maoi: allTags.maoi && tags.maoi, depressant: allTags.depressant }) });
    const date = new Date(start); date.setDate(start.getDate() + d - 1);
    const sections = {};
    SECTIONS.forEach(([k]) => {
      sections[k] = ADVICE
        .filter(a => a.k === k && d >= a.d[0] && d <= a.d[1])
        .filter(a => a.always || a.tags.some(t => tags[t]))
        .filter(a => !a.when || a.when(dctx))
        .map(a => ({ a, score: (a.p || 0) * 10 + (a.always ? 0 : a.tags.reduce((n, t) => n + (tags[t] || 0), 0)) }))
        .sort((x, y) => y.score - x.score)
        .slice(0, PER_SECTION)
        .map(({ a }) => ({ t: typeof a.t === "function" ? a.t(ctx, d) : a.t, w: a.w }));
    });
    const prev = days.length ? days[days.length - 1].recipes.map(r => r.n) : [];
    const recipes = RECIPES
      .filter(r => !(allTags.maoi && d <= 2 && r.fermented))
      .map(r => ({ r, score: r.tags.reduce((n, t) => n + (tags[t] || 0), 0) - (prev.includes(r.n) ? 5 : 0) }))
      .sort((x, y) => y.score - x.score).slice(0, 3).map(x => x.r);
    days.push({ n: d, date, title: dayTitle(d, len, tags), note: dayNote(d, len, tags, lots.length), sections, recipes, waterL: ctx.waterL(d) });
  }
  const combos = COMBOS.filter(c => c.test(set));
  if (lots.length) combos.unshift({ t: "You took a lot", w: "Your plan has an extra day. Have someone check in on you today." });
  return { list, set, len, days, ctx, combos };
}

function dayTitle(d, len, t) {
  if (d === 1) return t.maoi ? "Settle and stay careful" : (t.hydration || t.electrolytes) ? "Rehydrate and stabilise" : t.integration ? "Rest and land" : "Rest and recover";
  if (d === len) return "Back to your rhythm";
  if (d === 2) return t.appetite || t.gut ? "Refuel gently" : "Refuel and rest";
  if (t.serotonin || t.dopamine) return "Rebuild your chemistry";
  return t.integration ? "Integrate and rebalance" : "Rebalance";
}

function dayNote(d, len, t, lots) {
  if (d === 1 && t.maoi) return "Fresh food only and no new medicines for 24 hours.";
  if (d === 1 && t.depressant) return "Rest somewhere safe. No driving today.";
  if (d === 1 && lots) return "Rest is the treatment today. Let a friend know how you are.";
  if (d === 1 && t.integration) return "Write down three lines about your experience.";
  if (d === 1) return "Sleep when you can. Eat small and often.";
  if (t.b12 && d === 2) return "Keep taking B12 all week.";
  if (t.serotonin && (d === 3 || d === 4)) return "The midweek dip often lands now. It's chemistry and it passes.";
  if (t.dopamine && d === 2) return "Flat and craving? Normal. Plan one small treat.";
  if (t.integration && d <= 3) return "Walk in nature. Talk it through with someone you trust.";
  if (t.bladder) return "Still painful to pee? See a doctor.";
  if (d === len) return "Compare with day 1. Leave time before the next session.";
  return "A daylight walk resets sleep and mood.";
}

/* ---------- Calendar export ---------- */
const ymd = d => d.getFullYear() + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0");
const ymdDash = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const shortLabel = t => t.replace(" · ", " ");

function eventFor(P, day) {
  const title = "Days After · Day " + day.n + ": " + day.title;
  const lines = SECTIONS.map(([k, , , verb]) => day.sections[k].length ? verb.toUpperCase() + "\n" + day.sections[k].map(i => "• " + shortLabel(i.t)).join("\n") : "").filter(Boolean);
  const body = "Day " + day.n + " of " + P.len + "\n\n" + lines.join("\n\n") + "\n\nTIP\n" + day.note;
  const next = new Date(day.date); next.setDate(next.getDate() + 1);
  return { title, body, start: day.date, end: next };
}
// one all-day event spanning every day of the plan, with the day-by-day list inside
function planEvent(P) {
  const days = P.days.map(day => "DAY " + day.n + " · " + day.title.toUpperCase() + "\n" +
    SECTIONS.map(([k, , , verb]) => day.sections[k].length ? verb + ": " + day.sections[k].map(i => shortLabel(i.t)).join(" / ") : "").filter(Boolean).join("\n") +
    "\nTip: " + day.note).join("\n\n");
  const end = new Date(P.days[0].date); end.setDate(end.getDate() + P.len);
  return { title: "Days After · " + P.len + "-day recovery", body: days, start: P.days[0].date, end };
}

  const P = S.plan;
  const prose = P.list.map(({ s }) =>
    '<b>' + esc(s.n) + '</b><button class="qbtn inline" data-act="expand" data-id="' + s.id + '" aria-expanded="' + S.expanded.has(s.id) + '" aria-label="More about ' + esc(s.n) + '">?</button> ' + esc(STORY[s.id])).join(" ");
  const more = P.list.filter(({ s }) => S.expanded.has(s.id)).map(({ s }) =>
    '<div class="more"><p><b>' + esc(s.n) + '</b> · ' + esc(s.info.what) + '</p><p><span class="label">Get help</span>' + esc(s.flag) + '</p></div>').join("");
  const combos = P.combos.length ? '<div class="caution">' + P.combos.map(c =>
    '<div class="c">' + ic("alert", "sm") + '<div><b>' + esc(c.t) + '</b><span>' + esc(c.w) + '</span></div></div>').join("") + '</div>' : '';
  return top(true) + '<h1>What happened in your body</h1>' +
    '<article class="story" style="margin-top:16px"><p class="prose">' + prose + '</p>' + more + '</article>' + combos;
}

function vPlan() {
  const P = S.plan, m = S.planMeta, day = P.days[S.day - 1];
  const facts = [
    '<span class="fact"><b>' + P.list.length + '</b> substance' + (P.list.length > 1 ? "s" : "") + '</span>',
    '<span class="fact"><b>' + P.len + '</b> days</span>',
    m.w ? '<span class="fact"><b>' + m.w + '</b> kg</span>' : '',
    m.h ? '<span class="fact"><b>' + m.h + '</b> cm</span>' : '',
    P.ctx.kcal ? '<span class="fact">≈ <b>' + P.ctx.kcal.toLocaleString("en-GB") + '</b> kcal / day</span>' : ''
  ].join("");
  const dayBtns = P.days.map(d =>
    '<button class="daybtn" role="tab" data-act="day" data-day="' + d.n + '" aria-selected="' + (d.n === S.day) + '"><span class="n">Day ' + d.n + '</span><span class="d">' + fmtShort(d.date) + '</span></button>').join("");
  const sections = SECTIONS.map(([k, name, icon]) => {
    const items = day.sections[k];
    if (!items.length) return "";
    return '<section class="sect"><div class="sh">' + ic(icon, "sm") + '<span class="label">' + name + '</span></div><div class="items">' +
      items.map(it => '<div class="item withicon">' + duo(iconFor(it.t)) + '<div class="itxt"><div class="it">' + esc(it.t) + '</div><div class="why">' + esc(it.w[0]) + '</div></div></div>').join("") +
      '</div></section>';
  }).join("");
  return top(true) +
    '<div class="planhead"><h1>Your recovery</h1></div>' +
    '<div class="daybar" role="tablist" style="margin-top:18px">' + dayBtns + '</div>' +
    '<div class="dayhead"><span class="t">' + esc(day.title) + '</span></div>' +
    waterCard(day) +
    sections + recipeList(day) +
    '<div class="disclaimer">Not medical advice. Emergency: 112.</div>';
}

const GLASS = 0.2;
const waterGoal = day => Math.ceil(day.waterL / GLASS - 0.01);
function waterCard(day) {
  const goal = waterGoal(day);
  const n = Math.min(goal, ((S.water[S.planMeta.created] || {})[day.n]) || 0);
  const C = 2 * Math.PI * 30, pct = n / goal;
  return '<div class="water"><div class="ringwrap"><svg class="ring" viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="30" class="track"/>' +
    '<circle cx="36" cy="36" r="30" class="fill" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + (C * (1 - pct)).toFixed(1) + '"/></svg>' +
    '<span class="rin mono">' + Math.round(pct * 100) + '%</span></div>' +
    '<div class="wtxt"><div class="wn mono"><b>' + +(n * GLASS).toFixed(1) + '</b> / ' + day.waterL + ' L</div><div class="ws mono">' + n + ' / ' + goal + ' glasses</div></div>' +
    '<button class="iconbtn" data-act="water" data-d="-1" aria-label="Remove a glass"' + (n ? '' : ' disabled') + '>' + ic("minus", "sm") + '</button>' +
    '<button class="wplus" data-act="water" data-d="1" aria-label="Add a glass"' + (n >= goal ? ' disabled' : '') + '>' + ic("plus") + '</button></div>';
}

function recipeList(day) {
  if (!day.recipes.length) return "";
  return '<section class="sect"><div class="sh">' + ic("recipe", "sm") + '<span class="label">Recipes</span></div><div class="items">' +
    day.recipes.map(r => {
      const open = S.openRecipe === r.n;
      return '<button class="item recipe" data-act="recipe" data-n="' + esc(r.n) + '" aria-expanded="' + open + '"><div class="it">' + esc(r.n) + '<span class="amtag">' + r.min + ' min</span></div>' +
        (open ? '<ul class="ing">' + r.ing.map(i => '<li>' + esc(i) + '</li>').join("") + '</ul><div class="why">' + esc(r.how) + '</div>' : '') + '</button>';
    }).join("") + '</div></section>';
}

function vSaved() {
  const items = S.saved.slice().sort((a, b) => b.created.localeCompare(a.created)).map(s => {
    const names = s.subs.map(p => BYID[p.id] ? BYID[p.id].n : p.id).join(", ");
    const len = Math.min(5, Math.max(2, ...s.subs.map(p => BYID[p.id] ? subLen(BYID[p.id], p.amt || 2) : 2)));
    const del = S.confirmDel === s.id
      ? '<div class="confirm"><button data-act="nodel">Keep</button><button class="yes" data-act="yesdel" data-id="' + s.id + '">Delete</button></div>'
      : '<button class="iconbtn" data-act="askdel" data-id="' + s.id + '" aria-label="Delete plan">' + ic("trash", "sm") + '</button>';
    return '<div class="scard"><span class="glyph">' + ic("bookmark") + '</span><div class="txt"><button class="open" data-act="open" data-id="' + s.id + '"><div class="t">' + esc(names) + '</div><div class="s mono">' + fmtDay(new Date(s.created)) + ' · ' + len + ' days</div></button></div>' + del + '</div>';
  }).join("");
  return top() + '<h1>Saved plans</h1>' +
    (items ? '<div class="saved">' + items + '</div>' :
      '<div class="emptystate">' + ic("bookmark", "lg") + '<span>No saved plans yet.</span><button class="btn2" data-act="nav" data-view="subs">Choose substances</button></div>');
}

function vProfile() {
  const p = S.profile;
  const bmi = p.w && p.h ? (p.w / Math.pow(p.h / 100, 2)).toFixed(1) : "–";
  const water = p.w ? (p.w * 0.035).toFixed(1) + " L" : "–";
  const prot = p.w ? Math.round(p.w * 1.2 / 5) * 5 + " g" : "–";
  return top() + '<h1>Your body</h1>' + bodyFields() +
    '<div class="panel"><div class="kv"><span>BMI</span><span class="v">' + bmi + '</span></div><div class="kv"><span>Base water target</span><span class="v">' + water + '</span></div><div class="kv"><span>Protein target</span><span class="v">' + prot + '</span></div></div>' +
    '<div class="actions"><button class="btn2 primary" data-act="savebody">Save</button></div>' +
    '<h2>Privacy</h2><div class="panel"><p class="lead">Nothing leaves this device.</p>' +
    (S.confirmDel === "all" ? '<div class="confirm"><button data-act="nodel">Cancel</button><button class="yes" data-act="wipe">Delete everything</button></div>'
      : '<div><button class="btn2" data-act="askwipe">' + ic("trash", "sm") + 'Clear all data on this device</button></div>') + '</div>' +
    '<h2>Emergency</h2><div class="panel"><div class="kv">' + ic("phone", "sm") + '<span style="flex:1">Emergency services (EU)</span><span class="v">112</span></div></div>';
}

/* ---------- Sheets ---------- */
function sInfo(s) {
  const i = s.info;
  return '<div class="shead"><span class="glyph">' + ic(s.c) + '</span><div class="txt"><div class="t">' + esc(s.n) + '</div><div class="s">' + esc(s.aka) + '</div></div>' +
    '<button class="iconbtn" data-act="closesheet" aria-label="Close">' + ic("close", "sm") + '</button></div>' +
    '<div class="facts sheetfacts"><span class="fact">' + esc(CATNAME[s.c]) + '</span><span class="fact">Onset <b>' + esc(i.onset) + '</b></span><span class="fact">' + esc(s.dur) + '</span></div>' +
    '<div class="block"><span class="label">What it is</span><p>' + esc(i.what) + '</p></div>' +
    '<div class="block"><span class="label">How it’s used</span><p>' + esc(i.use) + '</p></div>' +
    '<div class="block"><span class="label">Safer use</span><ul>' + i.safer.map(x => '<li>' + esc(x) + '</li>').join("") + '</ul></div>' +
    '<div class="block caution"><div class="c">' + ic("alert", "sm") + '<div><b>Get help if</b><span>' + esc(s.flag) + ' Call 112.</span></div></div></div>';
}

function sCal() {
  const P = S.plan, all = planEvent(P);
  const perDay = P.days.map(d => '<a href="' + esc(googleUrl(eventFor(P, d))) + '" target="_blank" rel="noopener">Day ' + d.n + '</a>').join("");
  return '<div class="shead"><span class="glyph">' + ic("calendar") + '</span><div class="txt"><div class="t">Add to calendar</div><div class="s">' + fmtShort(all.start) + ' – ' + fmtShort(P.days[P.len - 1].date) + ' · all day</div></div>' +
    '<button class="iconbtn" data-act="closesheet" aria-label="Close">' + ic("close", "sm") + '</button></div>' +
    '<div class="calmain">' +
      '<a class="cta" href="' + esc(googleUrl(all)) + '" target="_blank" rel="noopener">' + ic("calendar", "sm") + 'Google Calendar · all ' + P.len + ' days</a>' +
      '<a class="btn2" href="' + esc(outlookUrl(all)) + '" target="_blank" rel="noopener">Outlook' + ic("ext", "sm") + '</a>' +
      '<button class="btn2" data-act="copyall">' + ic("copy", "sm") + 'Copy for Apple / other</button>' +
    '</div>' +
    '<div class="perday"><span class="label">Google per day</span>' + perDay + '</div>' +
    '<h2>Daily reminders</h2><div class="calrows">' + REMINDERS.map(r =>
      '<div class="calrow rem"><div class="txt"><div class="t">' + esc(r.t) + '</div></div>' +
      '<input class="time" type="time" id="rem-' + r.k + '" data-rem="' + r.k + '" value="' + esc(S.reminders[r.k]) + '" aria-label="' + esc(r.t) + ' time">' +
      '<div class="links"><a href="' + esc(reminderUrl(r, P)) + '" target="_blank" rel="noopener" data-remlink="' + r.k + '">Google' + ic("ext", "sm") + '</a></div></div>').join("") + '</div>' +
    '<div class="preview" hidden></div>';
}

function renderSheet() {
  if (!S.sheet) { sheetEl.innerHTML = ""; return; }
  const inner = S.sheet.type === "info" ? sInfo(BYID[S.sheet.id]) : S.sheet.type === "share" ? sShare() : sCal();
  sheetEl.innerHTML = '<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>' + inner + '</div></div>';
  const btn = sheetEl.querySelector('[data-act="closesheet"]'); if (btn) btn.focus();
}
function openSheet(s) { S.sheet = s; renderSheet(); }
function closeSheet() { S.sheet = null; renderSheet(); }

function render(keepScroll) {
  let html;
  if (S.view === "onboard") html = vOnboard();
  else if (S.view === "plan") html = vPlan();
  else if (S.view === "story") html = vStory();
  else if (S.view === "saved") html = vSaved();
  else if (S.view === "profile") html = vProfile();
  else html = vSubs();
  app.innerHTML = html;
  renderDock();
  if (!keepScroll) window.scrollTo(0, 0);
}

function renderDock() {
  if (S.view === "onboard") { dock.innerHTML = ""; return; }
  let cta = "";
  if (S.view === "subs") {
    const n = S.selected.size;
    cta = '<div class="cta-wrap"><button class="cta" data-act="create"' + (n ? "" : " disabled") + '>' + ic("spark", "sm") + 'Create recovery diet' + (n ? '<span class="count">' + n + '</span>' : '') + '</button></div>';
  } else if (S.view === "story") {
    cta = '<div class="cta-wrap"><button class="cta" data-act="toplan">' + ic("calendar", "sm") + 'See my recovery plan</button></div>';
  } else if (S.view === "plan") {
    cta = '<div class="cta-wrap"><button class="cta ghost" data-act="share" aria-label="Share plan" style="flex:0 0 54px">' + ic("share") + '</button>' +
      '<button class="cta" data-act="cal">' + ic("calendar", "sm") + 'Add to calendar</button></div>';
  }
  const cur = (S.view === "plan" || S.view === "story") ? "saved" : S.view;
  const tab = (v, icon, label, badge) => '<button class="tab" data-act="nav" data-view="' + v + '"' + (cur === v ? ' aria-current="page"' : '') + '>' + ic(icon) + label + (badge ? '<span class="badge">' + badge + '</span>' : '') + '</button>';
  dock.innerHTML = cta + '<nav class="tabs">' + tab("subs", "flask", "Substances") + tab("saved", "bookmark", "Saved", S.saved.length || "") + tab("profile", "user", "Profile") + '</nav>';
}

function openPlan(picks, meta) {
  S.planMeta = meta;
  S.plan = buildPlan(picks, { w: meta.w, h: meta.h }, meta.created);
  S.day = 1; S.expanded = new Set(); S.view = "story"; render();
}

/* ---------- Sharing ----------
   The link carries only substances, amounts and the start date: plan-<id><amount>_…-<yyyymmdd> */
const SHARE_BASE = "https://paulvanraak.github.io/Dashbord/";
function shareLink() {
  const m = S.planMeta;
  return SHARE_BASE + "#plan-" + m.subs.map(p => p.id + (p.amt || 2)).join("_") + "-" + ymd(new Date(m.created));
}
function readShared(hash) {
  const m = /^#plan-([a-z0-9_]+)-(\d{8})$/.exec(hash || "");
  if (!m) return null;
  const picks = m[1].split("_").map(t => ({ id: t.slice(0, -1), amt: +t.slice(-1) }))
    .filter(p => BYID[p.id] && p.amt >= 1 && p.amt <= 3);
  if (!picks.length) return null;
  const d = m[2], created = new Date(+d.slice(0, 4), +d.slice(4, 6) - 1, +d.slice(6, 8), 12);
  return isNaN(created) ? null : { picks, created: created.toISOString() };
}

function sShare() {
  const can = typeof navigator.share === "function";
  return '<div class="shead"><span class="glyph">' + ic("share") + '</span><div class="txt"><div class="t">Share plan</div><div class="s">The link holds what you took, not your weight.</div></div>' +
    '<button class="iconbtn" data-act="closesheet" aria-label="Close">' + ic("close", "sm") + '</button></div>' +
    '<div class="calmain">' +
      (can ? '<button class="cta" data-act="nativeshare">' + ic("share", "sm") + 'Share via…</button>' : '') +
      '<button class="' + (can ? 'btn2' : 'cta') + '" data-act="copylink">' + ic("copy", "sm") + 'Copy link</button>' +
      '<button class="btn2" data-act="copyplan">' + ic("copy", "sm") + 'Copy link + full plan</button>' +
    '</div>' +
    '<div class="preview">' + esc(shareLink()) + '</div>';
}

function copyText(text) {
  const done = () => toast("Copied");
  try {
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text));
  } catch (e) { fallbackCopy(text); }
}
function fallbackCopy(text) {
  const pre = sheetEl.querySelector(".preview");
  if (pre) { pre.hidden = false; pre.textContent = text; const r = document.createRange(); r.selectNodeContents(pre); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); toast("Text selected: copy it manually"); }
}

/* ---------- Events ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (act === "scrim") { if (e.target === b) closeSheet(); return; }
  if (act === "toggle") {
    const id = b.dataset.id;
    S.selected.has(id) ? S.selected.delete(id) : S.selected.set(id, 2);
    render(true);
    const el = app.querySelector('.rowmain[data-id="' + id + '"]'); if (el) el.focus({ preventScroll: true });
  } else if (act === "amt") { S.selected.set(b.dataset.id, +b.dataset.amt); render(true); }
  else if (act === "info") openSheet({ type: "info", id: b.dataset.id });
  else if (act === "water") {
    const key = S.planMeta.created, day = S.plan.days[S.day - 1];
    const m = S.water[key] = S.water[key] || {};
    const goal = waterGoal(day);
    m[day.n] = Math.min(goal, Math.max(0, (m[day.n] || 0) + +b.dataset.d));
    if (+b.dataset.d > 0 && m[day.n] === goal) toast("Water goal reached");
    persist(); render(true);
  }
  else if (act === "recipe") { S.openRecipe = S.openRecipe === b.dataset.n ? null : b.dataset.n; render(true); }
  else if (act === "expand") { const id = b.dataset.id; S.expanded.has(id) ? S.expanded.delete(id) : S.expanded.add(id); render(true); }
  else if (act === "theme") { S.theme = isDark() ? "light" : "dark"; document.documentElement.setAttribute("data-theme", S.theme); persist(); render(true); }
  else if (act === "copyall") { const ev = planEvent(S.plan); copyText(ev.title + "\n\n" + ev.body); }
  else if (act === "cal") openSheet({ type: "cal" });
  else if (act === "share") openSheet({ type: "share" });
  else if (act === "copylink") copyText(shareLink());
  else if (act === "copyplan") { const ev = planEvent(S.plan); copyText(shareLink() + "\n\n" + ev.body); }
  else if (act === "nativeshare") {
    navigator.share({ title: "Days After", text: "My recovery plan", url: shareLink() }).catch(() => {});
  }
  else if (act === "closesheet") closeSheet();
  else if (act === "copyday") { const d = S.plan.days[+b.dataset.day - 1]; const ev = eventFor(S.plan, d); copyText(ev.title + "\n\n" + ev.body); }
  else if (act === "cat") { S.cat = b.dataset.cat; render(true); }
  else if (act === "start") { readBody(); S.onboarded = true; persist(); S.view = "subs"; render(); }
  else if (act === "skip") { S.onboarded = true; persist(); S.view = "subs"; render(); }
  else if (act === "create") {
    const picks = [...S.selected].map(([id, amt]) => ({ id, amt }));
    const meta = { id: "p" + Date.now().toString(36), created: new Date().toISOString(), w: S.profile.w, h: S.profile.h, subs: picks };
    S.saved.push({ id: meta.id, created: meta.created, subs: picks, w: meta.w, h: meta.h });
    persist();
    openPlan(picks, meta);
    toast("Plan saved");
  }
  else if (act === "day") { S.day = +b.dataset.day; S.openRecipe = null; render(true); }
  else if (act === "back") { S.view = S.view === "plan" ? "story" : (S.planMeta && S.planMeta.id ? "saved" : "subs"); render(); }
  else if (act === "toplan") { S.view = "plan"; render(); }
  else if (act === "save") {
    const m = S.planMeta; m.id = "p" + Date.now().toString(36);
    S.saved.push({ id: m.id, created: m.created, subs: m.subs, w: m.w, h: m.h });
    persist(); render(true); toast("Plan saved on this device");
  } else if (act === "nav") { S.confirmDel = null; S.view = b.dataset.view; render(); }
  else if (act === "open") {
    const s = S.saved.find(x => x.id === b.dataset.id);
    if (s) openPlan(s.subs, Object.assign({}, s));
  } else if (act === "askdel") { S.confirmDel = b.dataset.id; render(true); }
  else if (act === "nodel") { S.confirmDel = null; render(true); }
  else if (act === "yesdel") { S.saved = S.saved.filter(x => x.id !== b.dataset.id); S.confirmDel = null; persist(); render(true); toast("Plan deleted"); }
  else if (act === "savebody") { readBody(); render(true); toast("Saved"); }
  else if (act === "askwipe") { S.confirmDel = "all"; render(true); }
  else if (act === "wipe") {
    S.saved = []; S.profile = { w: null, h: null }; S.confirmDel = null;
    try { localStorage.removeItem(KEY); } catch (err) {}
    S.onboarded = true; persist(); render(true); toast("All data cleared");
  }
});

document.addEventListener("change", e => {
  const k = e.target.dataset && e.target.dataset.rem;
  if (!k || !e.target.value) return;
  S.reminders[k] = e.target.value; persist();
  const a = sheetEl.querySelector('[data-remlink="' + k + '"]');
  const r = REMINDERS.find(x => x.k === k);
  if (a && r) a.href = reminderUrl(r, S.plan);
});

document.addEventListener("keydown", e => { if (e.key === "Escape" && S.sheet) closeSheet(); });

document.addEventListener("input", e => {
  if (e.target.id !== "q") return;
  S.q = e.target.value;
  const pos = e.target.selectionStart;
  render(true);
  const q = document.getElementById("q"); q.focus(); try { q.setSelectionRange(pos, pos); } catch (err) {}
});

/* ---------- Splash ---------- */
const splash = document.getElementById("splash");
function hideSplash() { if (splash.classList.contains("out")) return; splash.classList.add("out"); setTimeout(() => { splash.hidden = true; }, 520); }
splash.addEventListener("click", hideSplash);
splash.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") hideSplash(); });
setTimeout(hideSplash, 2200);

const shared = readShared(location.hash);
if (shared) {
  S.onboarded = true;
  const meta = { id: "p" + Date.now().toString(36), created: shared.created, w: S.profile.w, h: S.profile.h, subs: shared.picks };
  S.saved.push({ id: meta.id, created: meta.created, subs: meta.subs, w: null, h: null });
  openPlan(shared.picks, meta);
  setTimeout(() => toast("Shared plan opened"), 2400);
} else render();
})();
</script>
